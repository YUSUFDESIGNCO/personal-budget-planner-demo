:root{
  --navy:#00327D;
  --navy-2:#0B4FA0;
  --navy-dim:#5471A3;
  --magenta:#D50083;
  --magenta-soft:#FBE4F1;
  --cream:#F5F3EE;
  --surface:#FFFFFF;
  --card:#FFFFFF;
  --border:#E6E1D6;
  --text:#1B2433;
  --text-soft:#616B7A;
  --green:#1E8F5C;
  --green-soft:#E3F5EC;
  --amber:#B7791F;
  --amber-soft:#FBF0DB;
  --red:#C0293F;
  --red-soft:#FBE3E7;
  --radius:12px;
  --radius-lg:16px;
  --shadow: 0 1px 2px rgba(0,50,125,.06), 0 6px 18px rgba(0,50,125,.08);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
/* ============================================================
   YDC TYPOGRAPHY SYSTEM — single Montserrat family, one weight
   scale used consistently everywhere (sidebar, headings, KPI
   numbers, buttons, forms, tables, badges, modals, charts):
     Page/App Title ........ 700
     Section Heading ....... 700
     Card Heading (h3/h4 in cards, modals, empty states) .. 600
     Body Text .............. 400
     Labels (form) ........... 600
     Buttons .................. 600
     Navigation ................ 600
     KPI Numbers .................. 700
   ============================================================ */
body{
  font-family:'Montserrat','Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--cream);
  color:var(--text);
  font-size:14px;
  font-weight:400;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:700;color:var(--navy);}
.modal-header h3,.card-header h3,.empty-state h4,.welcome-option h4{font-weight:600;}
p{margin:0 0 8px;}
button{font-family:inherit;font-weight:600;cursor:pointer;}
a{color:var(--navy);}
input,select,textarea{font-family:inherit;font-weight:400;max-width:100%;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#D7D0C0;border-radius:8px;}
:focus-visible{outline:3px solid var(--navy-2);outline-offset:2px;}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}

/* ---------- App shell layout ---------- */
#app{display:flex;min-height:100vh;}
#sidebar{
  width:240px;flex-shrink:0;background:var(--navy);color:#fff;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
#sidebar .brand{padding:22px 20px 14px;border-bottom:1px solid rgba(255,255,255,.14);}
#sidebar .brand .logo-row{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
#sidebar .brand h1{color:#fff;font-size:15.5px;line-height:1.25;}
#sidebar .brand .tagline{color:rgba(255,255,255,.65);font-size:10.5px;margin-top:4px;letter-spacing:.3px;text-transform:uppercase;}
.nav-section{padding:14px 12px 4px;}
.nav-section-title{color:rgba(255,255,255,.5);font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;padding:0 10px 6px;}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:rgba(255,255,255,.86);
  padding:9px 10px;border-radius:9px;font-size:13px;font-weight:600;margin-bottom:2px;
}
.nav-item .nav-ic{display:none;}
.nav-item:hover{background:rgba(255,255,255,.10);color:#fff;}
.nav-item.active{background:var(--magenta);color:#fff;}
.nav-item:focus-visible,#sidebar-toggle:focus-visible{outline:3px solid #fff;outline-offset:2px;}
#sidebar .foot{padding:14px 20px 18px;color:rgba(255,255,255,.45);font-size:10.5px;border-top:1px solid rgba(255,255,255,.12);}

#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 26px;
  background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40;
}
#topbar h2{font-size:18px;}
#topbar .top-actions{display:flex;align-items:center;gap:12px;}
#sidebar-toggle{display:none;background:none;border:1px solid var(--border);border-radius:9px;padding:7px 10px;font-size:16px;color:var(--navy);}
.save-indicator{font-size:11px;color:var(--text-soft);display:flex;align-items:center;gap:6px;white-space:nowrap;}
.save-dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;}
.save-dot.err{background:var(--red);}
.save-indicator.save-error{color:var(--red);}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.lang-switcher{display:flex;align-items:center;flex-shrink:0;}
.lang-switcher select{
  appearance:none;-webkit-appearance:none;-moz-appearance:none;
  font-family:'Montserrat','Segoe UI',system-ui,sans-serif;
  font-size:12px;font-weight:700;letter-spacing:.2px;
  background-color:var(--cream);color:var(--navy);
  border:1.5px solid var(--navy);border-radius:20px;
  padding:6px 28px 6px 13px;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M0 0l5 6 5-6z' fill='%2300327D'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 11px center;
}
.lang-switcher select:hover{border-color:var(--magenta);}
.lang-switcher select:focus{outline:none;border-color:var(--magenta);box-shadow:0 0 0 3px var(--magenta-soft);}
@media(max-width:600px){.lang-switcher select{font-size:11.5px;padding:6px 24px 6px 11px;}}
#content{padding:22px 26px 60px;flex:1;}
#sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(10,20,40,.45);z-index:140;}

@media(max-width:880px){
  #sidebar{position:fixed;left:0;top:0;height:100vh;transform:translateX(-100%);transition:transform .22s ease;z-index:150;}
  #sidebar.open{transform:translateX(0);box-shadow:0 0 30px rgba(0,0,0,.35);}
  #sidebar-backdrop.open{display:block;}
  #sidebar-toggle{display:inline-flex;align-items:center;justify-content:center;}
  #content{padding:16px 14px 60px;}
  #topbar{padding:10px 14px;}
}

/* ---------- Grid / layout helpers ---------- */
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
.two-col{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;}
@media(max-width:1200px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:1050px){.two-col{grid-template-columns:minmax(0,1fr);}}
@media(max-width:720px){.grid-4,.grid-3,.grid-2{grid-template-columns:minmax(0,1fr);}}
.stack{display:flex;flex-direction:column;gap:14px;}
.row{display:flex;align-items:center;gap:10px;}
.row.wrap{flex-wrap:wrap;}
.row.between{justify-content:space-between;}
.spacer{flex:1;}

/* ---------- Cards ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow);}
.card.tight{padding:14px;}
.section-title{font-weight:700;color:var(--navy);font-size:14px;margin-bottom:10px;letter-spacing:.2px;}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap;}
.card-header h3{font-size:15px;}

.stat-card{display:flex;flex-direction:column;gap:6px;}
.stat-card .label{font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--text-soft);}
.stat-card .value{font-size:23px;font-weight:700;color:var(--navy);}
.stat-card .value.neg{color:var(--red);}
.stat-card .sub{font-size:11.5px;color:var(--text-soft);}
.stat-card .sub.up{color:var(--green);}
.stat-card .sub.down{color:var(--red);}
.stat-card .icon-badge{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:2px;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:9px;
  font-size:13px;font-weight:600;border:1px solid transparent;transition:filter .12s ease;white-space:nowrap;
}
.btn:active{filter:brightness(.94);}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover{background:var(--navy-2);}
.btn-accent{background:var(--magenta);color:#fff;}
.btn-accent:hover{filter:brightness(1.08);}
.btn-outline{background:#fff;border-color:var(--border);color:var(--navy);}
.btn-outline:hover{border-color:var(--navy-2);}
.btn-danger{background:var(--red);color:#fff;}
.btn-danger:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent;color:var(--text-soft);}
.btn-ghost:hover{background:#00000008;}
.btn-sm{padding:6px 11px;font-size:12px;}
.btn-icon{padding:7px 9px;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}
.btn-block{width:100%;}

/* ---------- Forms ---------- */
label{display:block;font-size:12px;font-weight:600;color:var(--text);margin-bottom:5px;}
.hint{font-size:11.5px;color:var(--text-soft);margin-top:4px;}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=tel],input[type=search],input[type=password],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:9px;font-size:13px;color:var(--text);background:#fff;
}
input:focus,select:focus,textarea:focus{border-color:var(--navy-2);}
textarea{resize:vertical;min-height:70px;}
.field{margin-bottom:13px;}
.field.error input,.field.error select,.field.error textarea{border-color:var(--red);}
.field-error{color:var(--red);font-size:11.5px;margin-top:4px;font-weight:600;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
.form-grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
@media(max-width:600px){.form-grid,.form-grid.cols-3{grid-template-columns:1fr;}}
.checkbox-row{display:flex;align-items:center;gap:8px;margin-bottom:13px;}
.checkbox-row input{width:auto;}
.input-prefix{position:relative;}
.input-prefix span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-soft);font-size:13px;}
.input-prefix input{padding-left:24px;}
.form-errors{background:var(--red-soft);border:1px solid #F0C4CC;color:var(--red);padding:10px 13px;border-radius:9px;font-size:12.5px;margin-bottom:12px;}
.form-errors ul{margin:4px 0 0;padding-left:18px;}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);}
table.data{width:100%;border-collapse:collapse;font-size:12.8px;min-width:560px;}
table.data th{text-align:left;background:#FAF8F3;color:var(--navy);font-weight:600;font-size:11px;letter-spacing:.3px;text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
table.data td{padding:10px 12px;border-bottom:1px solid #F0EEE6;vertical-align:middle;}
table.data tbody tr:last-child td{border-bottom:none;}
table.data tbody tr:hover{background:#FAF9F5;}
table.data td.num{text-align:right;font-variant-numeric:tabular-nums;}
.amount-pos{color:var(--green);font-weight:700;}
.amount-neg{color:var(--red);font-weight:700;}
.table-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.table-toolbar .search{flex:1;min-width:160px;}
.row-actions{display:flex;gap:6px;justify-content:flex-end;}

/* ---------- Badges / pills ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:10.6px;font-weight:700;letter-spacing:.2px;white-space:nowrap;}
.badge-green{background:var(--green-soft);color:var(--green);}
.badge-amber{background:var(--amber-soft);color:var(--amber);}
.badge-red{background:var(--red-soft);color:var(--red);}
.badge-navy{background:#E6EDF8;color:var(--navy);}
.badge-magenta{background:var(--magenta-soft);color:var(--magenta);}
.badge-gray{background:#EEEBE2;color:var(--text-soft);}
.pill{display:inline-flex;align-items:center;padding:7px 13px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:12px;font-weight:600;color:var(--text-soft);}
.pill.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;}

/* ---------- Progress ---------- */
.progress-track{background:#EEEBE2;border-radius:20px;height:9px;overflow:hidden;}
.progress-fill{height:100%;background:var(--magenta);border-radius:20px;transition:width .3s ease;}
.progress-fill.green{background:var(--green);}
.progress-fill.amber{background:var(--amber);}

/* ---------- Empty state ---------- */
.empty-state{text-align:center;padding:46px 20px;color:var(--text-soft);}
.empty-state .emoji{font-size:34px;margin-bottom:10px;}
.empty-state h4{color:var(--navy);font-size:14.5px;margin-bottom:6px;}
.empty-state p{font-size:12.5px;margin:0 0 14px;}

/* ---------- Charts ---------- */
.chart-card canvas{max-height:280px;}
.chart-wrap{position:relative;height:270px;}
#chart-cashflow-trend{background:#F5F3EE;border-radius:8px;}
.chart-wrap.tall{height:320px;}
.chart-wrap.small{height:200px;}
.chart-legend-note{font-size:11px;color:var(--text-soft);margin-top:8px;}


/* ---------- Dashboard visual-first layout (Phase 2) ---------- */
.dashboard-visual-stack{display:flex;flex-direction:column;gap:16px;}
.dashboard-welcome{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"copy actions" "copy filter";gap:10px 18px;align-items:center;padding:20px 22px;background:linear-gradient(135deg,#fff 0%,#F8FAFD 100%);border-color:#DCE4EF;}
.dashboard-welcome-copy{grid-area:copy;min-width:0;}
.dashboard-welcome-eyebrow{font-size:11px;font-weight:700;letter-spacing:.55px;text-transform:uppercase;color:var(--magenta);margin-bottom:5px;}
.dashboard-welcome h1{margin:0;color:var(--navy);font-size:23px;line-height:1.2;}
.dashboard-welcome .hint{margin-top:5px;}
.dashboard-welcome-actions{grid-area:actions;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;}
.dashboard-welcome-filter{grid-area:filter;justify-self:end;}
.dashboard-welcome-filter .range-filter{margin:0;}
.dashboard-main-charts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;}
.dashboard-main-charts .chart-card--wide{grid-column:1 / -1;}
.dashboard-kpi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
.dashboard-kpi-primary .stat-card{min-height:92px;}
.dashboard-kpi-secondary{grid-template-columns:repeat(2,minmax(0,1fr));}
.dashboard-kpi-secondary .stat-card{min-height:76px;}
.dashboard-cashflow-card{min-width:0;}
.dashboard-chart-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
.dashboard-chart-grid .chart-card{min-width:0;}
.dashboard-chart-grid .chart-card:last-child{grid-column:1 / -1;}
.dashboard-alerts{display:flex;flex-direction:column;gap:0;}
.dashboard-alerts .alert{margin-bottom:10px;}
.dashboard-intro{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.dashboard-intro .section-title{margin-bottom:2px;}
.dashboard-intro .hint{margin-top:0;}
@media(max-width:1050px){
  .dashboard-welcome{grid-template-columns:1fr;grid-template-areas:"copy" "actions" "filter";}
  .dashboard-welcome-actions{justify-content:flex-start;}
  .dashboard-welcome-filter{justify-self:start;}
  .dashboard-kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media(max-width:720px){
  .dashboard-main-charts,.dashboard-chart-grid{grid-template-columns:minmax(0,1fr);}
  .dashboard-main-charts .chart-card--wide{grid-column:auto;}
  .dashboard-chart-grid .chart-card:last-child{grid-column:auto;}
  .dashboard-kpi-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;}
  .dashboard-welcome{padding:16px;}
}
@media(max-width:480px){
  .dashboard-kpi-grid,.dashboard-kpi-secondary{grid-template-columns:minmax(0,1fr);}
  .dashboard-welcome-actions .btn{flex:1 1 100%;}
}
/* ---------- Alerts / callouts ---------- */
.alert{display:flex;gap:11px;padding:12px 14px;border-radius:11px;border:1px solid transparent;font-size:12.6px;margin-bottom:10px;align-items:flex-start;}
.alert .ic{font-size:16px;line-height:1;}
.alert-danger{background:var(--red-soft);border-color:#F0C4CC;color:#7A1B2C;}
.alert-warning{background:var(--amber-soft);border-color:#EBD8AD;color:#6B4E10;}
.alert-info{background:#E6EDF8;border-color:#C9D8F2;color:var(--navy);}
.alert strong{display:block;margin-bottom:1px;}

/* ---------- Modal ---------- */
#modal-root{display:none;position:fixed;inset:0;background:rgba(10,20,40,.5);z-index:200;align-items:center;justify-content:center;padding:16px;}
#modal-root.open{display:flex;}
#modal-box{background:#fff;border-radius:var(--radius-lg);max-width:560px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);}
#modal-box.wide{max-width:760px;}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:2;}
.modal-header h3{font-size:16px;}
.modal-close{background:none;border:none;font-size:22px;line-height:1;color:var(--text-soft);padding:2px 6px;border-radius:7px;}
.modal-close:hover{background:#00000010;}
.modal-body{padding:20px;}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:16px 20px;border-top:1px solid var(--border);position:sticky;bottom:0;background:#fff;}
@media(max-width:600px){.modal-footer{flex-direction:column-reverse;} .modal-footer .btn{width:100%;}}

/* ---------- Toasts ---------- */
#toast-root{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px;max-width:320px;}
.toast{background:var(--navy);color:#fff;padding:11px 15px;border-radius:10px;font-size:12.6px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);}
.toast.success{background:var(--green);}
.toast.error{background:var(--red);}
.toast.warning{background:var(--amber);}
@media(max-width:600px){#toast-root{left:14px;right:14px;bottom:14px;max-width:none;}}

/* ---------- Welcome gate ---------- */
#welcome-gate{position:fixed;inset:0;background:linear-gradient(160deg,var(--navy) 0%,#001F52 100%);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;}
.welcome-card{background:#fff;border-radius:20px;max-width:620px;width:100%;padding:34px 32px;box-shadow:0 30px 80px rgba(0,0,0,.4);}
.welcome-card h2{font-size:22px;margin-bottom:6px;}
.welcome-card .sub{color:var(--text-soft);font-size:13px;margin-bottom:22px;}
.welcome-choice{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:8px;}
@media(max-width:560px){.welcome-choice{grid-template-columns:1fr;}}
.welcome-option{border:2px solid var(--border);border-radius:14px;padding:18px;text-align:left;background:#fff;transition:border-color .15s ease;}
.welcome-option:hover{border-color:var(--magenta);}
.welcome-option .opt-icon{font-size:22px;margin-bottom:8px;}
.welcome-option h4{color:var(--navy);font-size:14.5px;margin-bottom:5px;}
.welcome-option p{font-size:12px;color:var(--text-soft);margin:0;}
.welcome-disclaimer{font-size:10.8px;color:var(--text-soft);margin-top:18px;line-height:1.5;border-top:1px solid var(--border);padding-top:14px;}

/* ---------- Misc ---------- */
.divider{height:1px;background:var(--border);margin:16px 0;}
.muted{color:var(--text-soft);}
.mono{font-variant-numeric:tabular-nums;}
.kbd-hint{font-size:11px;color:var(--text-soft);}
.disclaimer-box{background:#FAF8F3;border:1px dashed var(--border);border-radius:10px;padding:12px 14px;font-size:11.6px;color:var(--text-soft);line-height:1.6;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;}
.tab-btn{padding:10px 14px;background:none;border:none;border-bottom:2px solid transparent;font-size:12.8px;font-weight:600;color:var(--text-soft);white-space:nowrap;}
.tab-btn.active{color:var(--navy);border-bottom-color:var(--magenta);}
.avatar-circle{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;}

@media(max-width:600px){
  .grid-4,.grid-3,.grid-2,.two-col{grid-template-columns:minmax(0,1fr);}
  #topbar{padding:10px 14px;flex-wrap:wrap;row-gap:8px;}
  .table-toolbar{flex-direction:column;align-items:stretch;}
  .card{padding:15px;}
  table.data{min-width:480px;}
}
@media print{
  #sidebar,#topbar,#toast-root,.no-print{display:none!important;}
  #content{padding:0;}
}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar-backdrop" aria-hidden="true"></div>
  <nav id="sidebar" aria-label="Main navigation" aria-hidden="false">
    <div class="brand">
      <div class="logo-row">
        <h1>PERSONAL BUDGET<br>PLANNER</h1>
      </div>
    </div>
    <div id="nav-container" style="flex:1;overflow-y:auto;padding-bottom:10px;"></div>
    <div class="foot">Personal Budget Planner &middot; All data stored locally on this device</div>
  </nav>
  <div id="main">
    <div id="topbar">
      <div class="row">
        <button id="sidebar-toggle" type="button" aria-label="Open navigation" data-i18n-aria="shell.openNavigation" aria-expanded="false" aria-controls="sidebar">&#9776;</button>
        <h2 id="page-title">Dashboard</h2>
      </div>
      <div class="top-actions">
        <span id="save-indicator" class="save-indicator"><span class="save-dot ok"></span> Saved</span>
        <button class="btn btn-accent btn-sm" id="profile-btn">Profile</button>
        <div class="lang-switcher">
          <label for="lang-select" class="visually-hidden">Language / Idioma / Idioma / Langue / Sprache</label>
          <select id="lang-select" aria-label="Language / Idioma / Idioma / Langue / Sprache">
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="pt">Português</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
          </select>
        </div>
      </div>
    </div>
    <main id="content" role="main"></main>
  </div>
</div>

<div id="modal-root" aria-hidden="true">
  <div id="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-description" tabindex="-1"></div>
</div>
<div id="toast-root" aria-live="polite"></div>
<div id="welcome-gate" style="display:none;"></div>

/* ---------- Guide ---------- */
"guide.pageTitle":"Guide","guide.intro":"Everything you need to get the most out of Personal Budget Planner.",
"guide.gettingStarted.title":"Getting Started","guide.gettingStarted.body":"When you first open the app, choose \"Explore with Demo Data\" to see a realistic sample budget, or \"Start Fresh\" to begin with your own numbers. You can also load demo data or start fresh later from Settings.",
"guide.dashboard.title":"Dashboard","guide.dashboard.body":"The Dashboard shows total income for the selected date range, current-month planned budget, current-month actual spending, current-month remaining budget, savings across all goals, and current-month budget status. Its six charts are labeled to show whether they use the selected range, current month, last six months, or all savings goals.",
"guide.income.title":"Income","guide.income.body":"Record income such as salary, freelance work, gifts, or other sources with an amount, date, frequency, and type. The frequency (one-time, weekly, biweekly, or monthly) is stored as information about that income entry; it does not automatically create future income entries. Each income record feeds the Dashboard, Transactions, and Reports.",
"guide.budget.title":"Budget","guide.budget.body":"Set a planned spending amount for each category for a selected month. Planned is the amount you intend to spend; Actual is the total of recorded expenses in that category for the month; Remaining is Planned minus Actual; and % Used is Actual divided by Planned. Budget Status uses the actual spending, planned amount, and your near-limit threshold.",
"guide.expenses.title":"Expenses","guide.expenses.body":"Record actual spending with a date, description, category, amount, and payment method, plus optional notes. Expenses feed the matching budget category, Dashboard, Transactions, charts, and Reports automatically.",
"guide.transactions.title":"Transactions","guide.transactions.body":"Transactions is a derived view that combines your Income and Expenses into one searchable, filterable history. It is not a separate third financial database: adding or editing an income or expense changes the corresponding transaction view.",
"guide.savingsGoals.title":"Savings Goals","guide.savingsGoals.body":"Create savings goals with a name, target amount, optional target date, current amount, and notes. Use \"Add Funds\" to record contributions and update the goal progress. Savings goals are summarized on the Dashboard and in the Savings report.",
"guide.reports.title":"Reports","guide.reports.body":"Reports provides Monthly Budget, Income, Expenses, Category Spending, Planned vs Actual, and Savings views. Report filters use the applicable month, category, or date range. CSV export is available on the report views that provide an Export CSV button.",
"guide.settings.title":"Settings","guide.settings.body":"Settings manages your profile, currency, date format, first day of week, near-limit alert threshold, categories, and payment methods. It also provides Demo Data, Start Fresh, Backup, Restore, CSV exports, and Reset All Data.",
"guide.demoData.title":"Demo Data","guide.demoData.body":"Demo Data loads a realistic sample budget with income, planned budgets, expenses, and savings goals across recent months so you can explore the app, charts, and reports. Loading demo data replaces the current app data, so the app creates a backup download first when appropriate.",
"guide.startFresh.title":"Start Fresh","guide.startFresh.body":"Start Fresh first attempts to download a JSON backup, then clears income, budgets, expenses, and savings goals. It keeps your profile, language, categories, payment methods, and other app settings. If the backup cannot be downloaded, Start Fresh does not continue.",
"guide.backupRestore.title":"Backup & Restore","guide.backupRestore.body":"Export Backup downloads the application data as a JSON backup file. Export backups regularly and keep a copy somewhere safe. Import Backup validates a JSON backup before replacing the data currently in the app and asks you to confirm the replacement. The language preference is stored separately and is not part of the JSON app-state backup.",
"guide.proTips.title":"Pro Tips","guide.proTips.body":"Set your monthly budget before the month starts. Review Budget regularly to spot Near Limit categories. Use Notes to record useful context. Export a JSON backup regularly, especially before importing another backup, using Start Fresh, or using Reset All Data.",
"guide.faq.title":"FAQ",
"guide.faq.q1":"Is my data stored locally?","guide.faq.a1":"Yes. The app runs in your browser and stores its application data locally on your device using browser local storage. It does not send your budgeting data to a server.",
"guide.faq.q2":"What happens if I close the browser?","guide.faq.a2":"The app normally saves changes automatically to local storage. Your data should remain available when you reopen the file in the same browser and on the same device, but you should export JSON backups regularly because local browser storage can be unavailable, cleared, or lost.",
"guide.faq.q3":"Can I use this on more than one device?","guide.faq.a3":"Yes, but data is stored locally per browser/device. Export a JSON Backup on one device and Import Backup on the other to transfer your app data.",
"guide.faq.q4":"How are Planned, Actual, Remaining, and % Used calculated?","guide.faq.a4":"Planned is the budget amount you set for a category and month. Actual is the total of recorded expenses for that category and month. Remaining is Planned minus Actual. % Used is Actual divided by Planned; when no positive plan exists, the app does not show a meaningful percentage.",
"guide.faq.q5":"Will Start Fresh delete my language or profile?","guide.faq.a5":"No. Start Fresh clears income, budgets, expenses, and savings goals after it successfully creates a backup download. Your profile, language, categories, payment methods, and other app settings are kept.",
"guide.faq.q6":"Do I need an internet connection?","guide.faq.a6":"No. The application is designed to run offline as a self-contained HTML file. It does not require an account, subscription, or network connection.",
 "guide.resetAllData.title":"Reset All Data",
 "guide.resetAllData.body":"Reset All Data first attempts to download a JSON backup, then restores the app to its default state, including your profile, settings, categories, payment methods, income, budgets, expenses, and savings goals. It also resets the saved language preference to English. If the backup cannot be downloaded or the new state cannot be saved, the reset is not completed.",
 "guide.faq.q7":"Does a weekly, biweekly, or monthly income repeat automatically?",
 "guide.faq.a7":"No. Frequency is recorded as information on the income entry. The app does not automatically generate future income entries from that frequency setting.",
 "guide.faq.q8":"What does Reset All Data do?",
 "guide.faq.a8":"Reset All Data creates a JSON backup download first, then restores the app to its default state and resets the saved language preference to English. It is different from Start Fresh because it also removes your profile, categories, payment methods, and other settings.",
},

/* ---------- Guide ---------- */
"guide.pageTitle":"Guía","guide.intro":"Todo lo que necesitas para aprovechar al máximo Personal Budget Planner.",
"guide.gettingStarted.title":"Primeros Pasos","guide.gettingStarted.body":"Cuando abras la aplicación por primera vez, elige \"Explorar con Datos de Muestra\" para ver un presupuesto de ejemplo realista, o \"Empezar de Cero\" para comenzar con tus propios números. También puedes cargar datos de muestra o empezar de cero más tarde desde Configuración.",
"guide.dashboard.title":"Panel","guide.dashboard.body":"El Panel muestra los ingresos totales del rango de fechas seleccionado, el presupuesto planificado del mes actual, el gasto real del mes actual, el presupuesto restante del mes actual, los ahorros de todas las metas y el estado del presupuesto del mes actual. Sus seis gráficos indican si usan el rango seleccionado, el mes actual, los últimos seis meses o todas las metas de ahorro.",
"guide.income.title":"Ingresos","guide.income.body":"Registra ingresos como salario, trabajo freelance, regalos u otras fuentes con monto, fecha, frecuencia y tipo. La frecuencia (una vez, semanal, quincenal o mensual) se guarda como información de esa entrada; no crea automáticamente futuras entradas de ingresos. Cada registro de ingreso alimenta el Panel, las Transacciones y los Informes.",
"guide.budget.title":"Presupuesto","guide.budget.body":"Establece un monto de gasto planificado para cada categoría en un mes seleccionado. Planificado es el monto que quieres gastar; Real es el total de gastos registrados en esa categoría durante el mes; Restante es Planificado menos Real; y % Usado es Real dividido por Planificado. El Estado del Presupuesto usa el gasto real, el monto planificado y tu umbral de cerca del límite.",
"guide.expenses.title":"Gastos","guide.expenses.body":"Registra los gastos reales con fecha, descripción, categoría, monto y método de pago, además de notas opcionales. Los gastos actualizan automáticamente la categoría correspondiente del presupuesto, el Panel, las Transacciones, los gráficos y los Informes.",
"guide.transactions.title":"Transacciones","guide.transactions.body":"Transacciones es una vista derivada que combina tus Ingresos y Gastos en un historial único, filtrable y con búsqueda. No es una tercera base de datos financiera independiente: añadir o editar un ingreso o gasto cambia la vista de transacciones correspondiente.",
"guide.savingsGoals.title":"Metas de Ahorro","guide.savingsGoals.body":"Crea metas de ahorro con nombre, monto objetivo, fecha objetivo opcional, monto actual y notas. Usa \"Añadir Fondos\" para registrar contribuciones y actualizar el progreso de la meta. Las metas de ahorro se resumen en el Panel y en el informe de Ahorros.",
"guide.reports.title":"Informes","guide.reports.body":"Los Informes ofrecen vistas de Presupuesto Mensual, Ingresos, Gastos, Gastos por Categoría, Planificado vs Real y Ahorros. Los filtros usan el mes, la categoría o el rango de fechas correspondiente. La exportación CSV está disponible en las vistas de informes que muestran el botón Exportar CSV.",
"guide.settings.title":"Configuración","guide.settings.body":"Configuración gestiona tu perfil, moneda, formato de fecha, primer día de la semana, umbral de alerta de cerca del límite, categorías y métodos de pago. También ofrece Datos de Muestra, Empezar de Cero, Copia de Seguridad, Restaurar, exportaciones CSV y Restablecer Todos los Datos.",
"guide.demoData.title":"Datos de Muestra","guide.demoData.body":"Datos de Muestra carga un presupuesto de ejemplo realista con ingresos, presupuestos planificados, gastos y metas de ahorro de meses recientes para explorar la aplicación, los gráficos y los informes. Al cargar datos de muestra se reemplazan los datos actuales, por lo que la aplicación crea primero una copia de seguridad cuando corresponde.",
"guide.startFresh.title":"Empezar de Cero","guide.startFresh.body":"Empezar de Cero intenta primero descargar una copia de seguridad JSON y luego elimina ingresos, presupuestos, gastos y metas de ahorro. Conserva tu perfil, idioma, categorías, métodos de pago y otras configuraciones. Si no se puede descargar la copia de seguridad, Empezar de Cero no continúa.",
"guide.backupRestore.title":"Respaldo y Restauración","guide.backupRestore.body":"Exportar Copia de Seguridad descarga los datos de la aplicación como un archivo de respaldo JSON. Exporta copias regularmente y guarda una copia en un lugar seguro. Importar Copia de Seguridad valida el JSON antes de reemplazar los datos actuales y pide confirmación. La preferencia de idioma se guarda por separado y no forma parte del respaldo JSON del estado de la aplicación.",
"guide.proTips.title":"Consejos Prácticos","guide.proTips.body":"Establece tu presupuesto mensual antes de que comience el mes. Revisa Presupuesto con regularidad para detectar categorías Cerca del Límite. Usa Notas para guardar contexto útil. Exporta una copia JSON regularmente, especialmente antes de importar otra copia, usar Empezar de Cero o Restablecer Todos los Datos.",
"guide.faq.title":"Preguntas Frecuentes",
"guide.faq.q1":"¿Mis datos se almacenan localmente?","guide.faq.a1":"Sí. La aplicación funciona en tu navegador y guarda los datos de la aplicación localmente en tu dispositivo mediante el almacenamiento local del navegador. No envía tus datos de presupuesto a un servidor.",
"guide.faq.q2":"¿Qué pasa si cierro el navegador?","guide.faq.a2":"La aplicación normalmente guarda los cambios automáticamente en el almacenamiento local. Tus datos deberían seguir disponibles al volver a abrir el archivo en el mismo navegador y dispositivo, pero exporta copias JSON regularmente porque el almacenamiento local del navegador puede no estar disponible, borrarse o perderse.",
"guide.faq.q3":"¿Puedo usarla en más de un dispositivo?","guide.faq.a3":"Sí, pero los datos se almacenan localmente por navegador y dispositivo. Exporta una Copia de Seguridad JSON en un dispositivo e impórtala en el otro para transferir los datos de la aplicación.",
"guide.faq.q4":"¿Cómo se calculan Planificado, Real, Restante y % Usado?","guide.faq.a4":"Planificado es el monto de presupuesto que estableces para una categoría y mes. Real es el total de gastos registrados para esa categoría y mes. Restante es Planificado menos Real. % Usado es Real dividido por Planificado; cuando no existe un plan positivo, la aplicación no muestra un porcentaje significativo.",
"guide.faq.q5":"¿Empezar de Cero borrará mi idioma o perfil?","guide.faq.a5":"No. Empezar de Cero elimina ingresos, presupuestos, gastos y metas de ahorro después de crear correctamente una copia de seguridad. Conserva tu perfil, idioma, categorías, métodos de pago y otras configuraciones.",
"guide.faq.q6":"¿Necesito conexión a internet?","guide.faq.a6":"No. La aplicación está diseñada para funcionar sin conexión como un archivo HTML independiente. No requiere cuenta, suscripción ni conexión de red.",
 "guide.resetAllData.title":"Restablecer Todos los Datos",
 "guide.resetAllData.body":"Restablecer Todos los Datos intenta primero descargar una copia de seguridad JSON y luego devuelve la aplicación a su estado predeterminado, incluyendo perfil, configuración, categorías, métodos de pago, ingresos, presupuestos, gastos y metas de ahorro. También restablece a inglés la preferencia de idioma guardada. Si no se puede descargar la copia o guardar el nuevo estado, el restablecimiento no se completa.",
 "guide.faq.q7":"¿Un ingreso semanal, quincenal o mensual se repite automáticamente?",
 "guide.faq.a7":"No. La frecuencia se registra como información de la entrada de ingresos. La aplicación no genera automáticamente futuras entradas de ingresos a partir de esa frecuencia.",
 "guide.faq.q8":"¿Qué hace Restablecer Todos los Datos?",
 "guide.faq.a8":"Restablecer Todos los Datos crea primero una descarga de copia de seguridad JSON, luego restaura la aplicación a su estado predeterminado y restablece a inglés la preferencia de idioma guardada. Se diferencia de Empezar de Cero porque también elimina tu perfil, categorías, métodos de pago y otras configuraciones.",
},

/* ---------- Guide ---------- */
"guide.pageTitle":"Guia","guide.intro":"Tudo o que você precisa para aproveitar ao máximo o Personal Budget Planner.",
"guide.gettingStarted.title":"Primeiros Passos","guide.gettingStarted.body":"Ao abrir o aplicativo pela primeira vez, escolha \"Explorar com Dados de Demonstração\" para ver um orçamento de exemplo realista, ou \"Começar do Zero\" para começar com seus próprios números. Você também pode carregar dados de demonstração ou começar do zero mais tarde em Configurações.",
"guide.dashboard.title":"Painel","guide.dashboard.body":"O Painel mostra a renda total do período selecionado, o orçamento planejado do mês atual, os gastos reais do mês atual, o orçamento restante do mês atual, a poupança de todas as metas e o status do orçamento do mês atual. Seus seis gráficos indicam se usam o período selecionado, o mês atual, os últimos seis meses ou todas as metas de poupança.",
"guide.income.title":"Renda","guide.income.body":"Registre receitas como salário, trabalho freelance, presentes ou outras fontes com valor, data, frequência e tipo. A frequência (uma vez, semanal, quinzenal ou mensal) é armazenada como informação daquela entrada; ela não cria automaticamente futuras entradas de receita. Cada registro de receita alimenta o Painel, as Transações e os Relatórios.",
"guide.budget.title":"Orçamento","guide.budget.body":"Defina um valor de gasto planejado para cada categoria em um mês selecionado. Planejado é o valor que você pretende gastar; Real é o total das despesas registradas nessa categoria no mês; Restante é Planejado menos Real; e % Usado é Real dividido por Planejado. O Status do Orçamento usa o gasto real, o valor planejado e seu limite de alerta.",
"guide.expenses.title":"Despesas","guide.expenses.body":"Registre gastos reais com data, descrição, categoria, valor e forma de pagamento, além de notas opcionais. As despesas atualizam automaticamente a categoria correspondente do orçamento, o Painel, as Transações, os gráficos e os Relatórios.",
"guide.transactions.title":"Transações","guide.transactions.body":"Transações é uma visão derivada que combina suas Receitas e Despesas em um histórico único, pesquisável e filtrável. Não é um terceiro banco de dados financeiro separado: adicionar ou editar uma receita ou despesa altera a visualização de transações correspondente.",
"guide.savingsGoals.title":"Metas de Poupança","guide.savingsGoals.body":"Crie metas de poupança com nome, valor-alvo, data-alvo opcional, valor atual e notas. Use \"Adicionar Fundos\" para registrar contribuições e atualizar o progresso da meta. As metas de poupança aparecem resumidas no Painel e no relatório de Poupança.",
"guide.reports.title":"Relatórios","guide.reports.body":"Os Relatórios oferecem visões de Orçamento Mensal, Receitas, Despesas, Gastos por Categoria, Planejado vs Real e Poupança. Os filtros usam o mês, a categoria ou o período de datas aplicável. A exportação CSV está disponível nas visões de relatório que exibem o botão Exportar CSV.",
"guide.settings.title":"Configurações","guide.settings.body":"Configurações gerencia seu perfil, moeda, formato de data, primeiro dia da semana, limite de alerta próximo do limite, categorias e formas de pagamento. Também oferece Dados de Demonstração, Começar do Zero, Backup, Restaurar, exportações CSV e Redefinir Todos os Dados.",
"guide.demoData.title":"Dados de Demonstração","guide.demoData.body":"Dados de Demonstração carrega um orçamento de exemplo realista com receitas, orçamentos planejados, despesas e metas de poupança de meses recentes para você explorar o aplicativo, gráficos e relatórios. Carregar dados de demonstração substitui os dados atuais, por isso o aplicativo cria primeiro um backup quando apropriado.",
"guide.startFresh.title":"Começar do Zero","guide.startFresh.body":"Começar do Zero tenta primeiro baixar um backup JSON e depois limpa receitas, orçamentos, despesas e metas de poupança. Mantém seu perfil, idioma, categorias, formas de pagamento e outras configurações. Se o backup não puder ser baixado, Começar do Zero não continua.",
"guide.backupRestore.title":"Backup e Restauração","guide.backupRestore.body":"Exportar Backup baixa os dados do aplicativo como um arquivo de backup JSON. Exporte backups regularmente e mantenha uma cópia em local seguro. Importar Backup valida o JSON antes de substituir os dados atuais do aplicativo e pede confirmação. A preferência de idioma é armazenada separadamente e não faz parte do backup JSON do estado do aplicativo.",
"guide.proTips.title":"Dicas Práticas","guide.proTips.body":"Defina seu orçamento mensal antes do início do mês. Revise Orçamento regularmente para identificar categorias Próximas do Limite. Use Notas para registrar contexto útil. Exporte um backup JSON regularmente, especialmente antes de importar outro backup, usar Começar do Zero ou Redefinir Todos os Dados.",
"guide.faq.title":"Perguntas Frequentes",
"guide.faq.q1":"Meus dados são armazenados localmente?","guide.faq.a1":"Sim. O aplicativo funciona no seu navegador e armazena os dados do aplicativo localmente no seu dispositivo usando o armazenamento local do navegador. Ele não envia seus dados de orçamento para um servidor.",
"guide.faq.q2":"O que acontece se eu fechar o navegador?","guide.faq.a2":"O aplicativo normalmente salva as alterações automaticamente no armazenamento local. Seus dados devem permanecer disponíveis quando você abrir o arquivo novamente no mesmo navegador e dispositivo, mas exporte backups JSON regularmente porque o armazenamento local pode ficar indisponível, ser apagado ou ser perdido.",
"guide.faq.q3":"Posso usar em mais de um dispositivo?","guide.faq.a3":"Sim, mas os dados são armazenados localmente por navegador e dispositivo. Exporte um Backup JSON em um dispositivo e importe-o no outro para transferir os dados do aplicativo.",
"guide.faq.q4":"Como são calculados Planejado, Real, Restante e % Usado?","guide.faq.a4":"Planejado é o valor do orçamento definido para uma categoria e mês. Real é o total das despesas registradas para essa categoria e mês. Restante é Planejado menos Real. % Usado é Real dividido por Planejado; quando não existe um plano positivo, o aplicativo não mostra uma porcentagem significativa.",
"guide.faq.q5":"Começar do Zero vai apagar meu idioma ou perfil?","guide.faq.a5":"Não. Começar do Zero limpa receitas, orçamentos, despesas e metas de poupança depois de criar corretamente um backup. Seu perfil, idioma, categorias, formas de pagamento e outras configurações são mantidos.",
"guide.faq.q6":"Preciso de conexão com a internet?","guide.faq.a6":"Não. O aplicativo foi projetado para funcionar offline como um arquivo HTML independente. Não requer conta, assinatura ou conexão de rede.",
 "guide.resetAllData.title":"Redefinir Todos os Dados",
 "guide.resetAllData.body":"Redefinir Todos os Dados tenta primeiro baixar um backup JSON e depois restaura o aplicativo ao estado padrão, incluindo perfil, configurações, categorias, formas de pagamento, receitas, orçamentos, despesas e metas de poupança. Também redefine para inglês a preferência de idioma salva. Se o backup não puder ser baixado ou o novo estado não puder ser salvo, a redefinição não é concluída.",
 "guide.faq.q7":"Uma receita semanal, quinzenal ou mensal se repete automaticamente?",
 "guide.faq.a7":"Não. A frequência é registrada como informação da entrada de receita. O aplicativo não gera automaticamente futuras entradas de receita com base nessa frequência.",
 "guide.faq.q8":"O que Redefinir Todos os Dados faz?",
 "guide.faq.a8":"Redefinir Todos os Dados cria primeiro um download de backup JSON, depois restaura o aplicativo ao estado padrão e redefine para inglês a preferência de idioma salva. É diferente de Começar do Zero porque também remove seu perfil, categorias, formas de pagamento e outras configurações.",

"guide.pageTitle":"Guide","guide.intro":"Tout ce dont vous avez besoin pour tirer le meilleur parti de Personal Budget Planner.",
"guide.gettingStarted.title":"Premiers Pas","guide.gettingStarted.body":"À la première ouverture de l’application, choisissez « Explorer avec des Données de Démonstration » pour voir un budget d’exemple réaliste, ou « Repartir de Zéro » pour commencer avec vos propres chiffres. Vous pouvez aussi charger les données de démonstration ou repartir de zéro plus tard depuis les Paramètres.",
"guide.dashboard.title":"Tableau de Bord","guide.dashboard.body":"Le Tableau de Bord affiche les revenus totaux de la période sélectionnée, le budget planifié du mois en cours, les dépenses réelles du mois en cours, le budget restant du mois en cours, l’épargne de tous les objectifs et le statut du budget du mois en cours. Ses six graphiques indiquent s’ils utilisent la période sélectionnée, le mois en cours, les six derniers mois ou tous les objectifs d’épargne.",
"guide.income.title":"Revenus","guide.income.body":"Enregistrez les revenus tels que salaire, travail indépendant, cadeaux ou autres sources avec un montant, une date, une fréquence et un type. La fréquence (unique, hebdomadaire, bimensuelle ou mensuelle) est enregistrée comme information de cette entrée ; elle ne crée pas automatiquement de futures entrées de revenus. Chaque revenu alimente le Tableau de Bord, les Transactions et les Rapports.",
"guide.budget.title":"Budget","guide.budget.body":"Définissez un montant de dépenses planifié pour chaque catégorie d’un mois sélectionné. Planifié est le montant que vous prévoyez de dépenser ; Réel est le total des dépenses enregistrées dans cette catégorie pendant le mois ; Restant est Planifié moins Réel ; et % Utilisé est Réel divisé par Planifié. Le statut du budget utilise les dépenses réelles, le montant planifié et votre seuil d’alerte.",
"guide.expenses.title":"Dépenses","guide.expenses.body":"Enregistrez les dépenses réelles avec une date, une description, une catégorie, un montant et un mode de paiement, ainsi que des notes facultatives. Les dépenses mettent automatiquement à jour la catégorie correspondante du budget, le Tableau de Bord, les Transactions, les graphiques et les Rapports.",
"guide.transactions.title":"Transactions","guide.transactions.body":"Transactions est une vue dérivée qui regroupe vos Revenus et vos Dépenses dans un historique unique, consultable et filtrable. Il ne s’agit pas d’une troisième base de données financière indépendante : l’ajout ou la modification d’un revenu ou d’une dépense modifie la vue des transactions correspondante.",
"guide.savingsGoals.title":"Objectifs d'Épargne","guide.savingsGoals.body":"Créez des objectifs d’épargne avec un nom, un montant cible, une date cible facultative, un montant actuel et des notes. Utilisez « Ajouter des Fonds » pour enregistrer des contributions et mettre à jour la progression. Les objectifs d’épargne sont résumés dans le Tableau de Bord et le rapport Épargne.",
"guide.reports.title":"Rapports","guide.reports.body":"Les Rapports proposent les vues Budget Mensuel, Revenus, Dépenses, Dépenses par Catégorie, Planifié vs Réel et Épargne. Les filtres utilisent le mois, la catégorie ou la période de dates applicable. L’export CSV est disponible dans les vues de rapport qui affichent un bouton Exporter CSV.",
"guide.settings.title":"Paramètres","guide.settings.body":"Les Paramètres gèrent votre profil, la devise, le format de date, le premier jour de la semaine, le seuil d’alerte proche de la limite, les catégories et les modes de paiement. Ils proposent aussi Données de Démonstration, Repartir de Zéro, Sauvegarde, Restauration, exports CSV et Réinitialiser Toutes les Données.",
"guide.demoData.title":"Données de Démonstration","guide.demoData.body":"Les Données de Démonstration chargent un budget d’exemple réaliste avec des revenus, des budgets planifiés, des dépenses et des objectifs d’épargne répartis sur des mois récents afin d’explorer l’application, les graphiques et les rapports. Le chargement des données de démonstration remplace les données actuelles ; l’application crée donc d’abord une sauvegarde lorsque cela est approprié.",
"guide.startFresh.title":"Repartir de Zéro","guide.startFresh.body":"Repartir de Zéro tente d’abord de télécharger une sauvegarde JSON, puis efface les revenus, budgets, dépenses et objectifs d’épargne. Votre profil, votre langue, vos catégories, vos modes de paiement et les autres paramètres de l’application sont conservés. Si la sauvegarde ne peut pas être téléchargée, Repartir de Zéro ne continue pas.",
"guide.backupRestore.title":"Sauvegarde et Restauration","guide.backupRestore.body":"Exporter une Sauvegarde télécharge les données de l’application sous forme de fichier de sauvegarde JSON. Exportez régulièrement des sauvegardes et conservez une copie dans un endroit sûr. Importer une Sauvegarde valide le fichier JSON avant de remplacer les données actuelles et demande une confirmation. La préférence de langue est stockée séparément et ne fait pas partie de la sauvegarde JSON de l’état de l’application.",
"guide.proTips.title":"Astuces Pratiques","guide.proTips.body":"Définissez votre budget mensuel avant le début du mois. Consultez régulièrement Budget pour repérer les catégories Proches de la Limite. Utilisez les Notes pour conserver un contexte utile. Exportez régulièrement une sauvegarde JSON, notamment avant d’importer une autre sauvegarde, d’utiliser Repartir de Zéro ou de Réinitialiser Toutes les Données.",
"guide.faq.title":"Questions Fréquentes",
"guide.faq.q1":"Mes données sont-elles stockées localement ?","guide.faq.a1":"Oui. L’application fonctionne dans votre navigateur et stocke les données de l’application localement sur votre appareil via le stockage local du navigateur. Elle n’envoie pas vos données budgétaires à un serveur.",
"guide.faq.q2":"Que se passe-t-il si je ferme le navigateur ?","guide.faq.a2":"L’application enregistre normalement automatiquement les modifications dans le stockage local. Vos données devraient rester disponibles lorsque vous rouvrez le fichier dans le même navigateur et sur le même appareil, mais exportez régulièrement des sauvegardes JSON car le stockage local peut devenir indisponible, être effacé ou être perdu.",
"guide.faq.q3":"Puis-je utiliser l’application sur plusieurs appareils ?","guide.faq.a3":"Oui, mais les données sont stockées localement par navigateur et par appareil. Exportez une Sauvegarde JSON sur un appareil et importez-la sur l’autre pour transférer les données de l’application.",
"guide.faq.q4":"Comment Planifié, Réel, Restant et % Utilisé sont-ils calculés ?","guide.faq.a4":"Planifié est le montant budgété pour une catégorie et un mois. Réel est le total des dépenses enregistrées pour cette catégorie et ce mois. Restant est Planifié moins Réel. % Utilisé est Réel divisé par Planifié ; lorsqu’il n’existe pas de plan positif, l’application n’affiche pas de pourcentage significatif.",
"guide.faq.q5":"Repartir de Zéro supprimera-t-il ma langue ou mon profil ?","guide.faq.a5":"Non. Repartir de Zéro efface les revenus, budgets, dépenses et objectifs d’épargne après avoir créé correctement une sauvegarde. Votre profil, votre langue, vos catégories, vos modes de paiement et les autres paramètres sont conservés.",
"guide.faq.q6":"Ai-je besoin d’une connexion Internet ?","guide.faq.a6":"Non. L’application est conçue pour fonctionner hors ligne comme un fichier HTML autonome. Aucun compte, abonnement ou connexion réseau n’est requis.",
 "guide.resetAllData.title":"Réinitialiser Toutes les Données",
 "guide.resetAllData.body":"Réinitialiser Toutes les Données tente d’abord de télécharger une sauvegarde JSON, puis restaure l’application à son état par défaut, y compris le profil, les paramètres, les catégories, les modes de paiement, les revenus, les budgets, les dépenses et les objectifs d’épargne. La préférence de langue enregistrée est également réinitialisée en anglais. Si la sauvegarde ne peut pas être téléchargée ou si le nouvel état ne peut pas être enregistré, la réinitialisation n’est pas effectuée.",
 "guide.faq.q7":"Un revenu hebdomadaire, bimensuel ou mensuel se répète-t-il automatiquement ?",
 "guide.faq.a7":"Non. La fréquence est enregistrée comme information de l’entrée de revenu. L’application ne génère pas automatiquement de futures entrées de revenus à partir de cette fréquence.",
 "guide.faq.q8":"Que fait Réinitialiser Toutes les Données ?",
 "guide.faq.a8":"Réinitialiser Toutes les Données crée d’abord un téléchargement de sauvegarde JSON, puis restaure l’application à son état par défaut et réinitialise en anglais la préférence de langue enregistrée. C’est différent de Repartir de Zéro car cela supprime également votre profil, vos catégories, vos modes de paiement et les autres paramètres.",
},

"guide.pageTitle":"Anleitung","guide.intro":"Alles, was Sie brauchen, um Personal Budget Planner optimal zu nutzen.",
"guide.gettingStarted.title":"Erste Schritte","guide.gettingStarted.body":"Wenn Sie die App zum ersten Mal öffnen, wählen Sie „Mit Beispieldaten Erkunden“, um ein realistisches Beispielbudget zu sehen, oder „Neu Beginnen“, um mit Ihren eigenen Zahlen zu starten. Sie können Beispieldaten auch später über die Einstellungen laden oder neu beginnen.",
"guide.dashboard.title":"Übersicht","guide.dashboard.body":"Die Übersicht zeigt die Gesamteinnahmen für den ausgewählten Zeitraum, das geplante Budget des aktuellen Monats, die tatsächlichen Ausgaben des aktuellen Monats, das verbleibende Budget des aktuellen Monats, die Ersparnisse aller Ziele und den Budgetstatus des aktuellen Monats. Die sechs Diagramme zeigen, ob sie den ausgewählten Zeitraum, den aktuellen Monat, die letzten sechs Monate oder alle Sparziele verwenden.",
"guide.income.title":"Einnahmen","guide.income.body":"Erfassen Sie Einnahmen wie Gehalt, freiberufliche Arbeit, Geschenke oder andere Quellen mit Betrag, Datum, Häufigkeit und Typ. Die Häufigkeit (einmalig, wöchentlich, zweiwöchentlich oder monatlich) wird als Information zum Eintrag gespeichert; sie erzeugt nicht automatisch zukünftige Einnahmen. Jeder Einnahmeneintrag fließt in Übersicht, Transaktionen und Berichte ein.",
"guide.budget.title":"Budget","guide.budget.body":"Legen Sie für jede Kategorie eines ausgewählten Monats einen geplanten Ausgabenbetrag fest. Geplant ist der Betrag, den Sie ausgeben möchten; Tatsächlich ist die Summe der erfassten Ausgaben dieser Kategorie im Monat; Verbleibend ist Geplant minus Tatsächlich; und % Verwendet ist Tatsächlich geteilt durch Geplant. Der Budgetstatus verwendet tatsächliche Ausgaben, den geplanten Betrag und Ihre Warnschwelle.",
"guide.expenses.title":"Ausgaben","guide.expenses.body":"Erfassen Sie tatsächliche Ausgaben mit Datum, Beschreibung, Kategorie, Betrag und Zahlungsmethode sowie optionalen Notizen. Ausgaben aktualisieren automatisch die passende Budgetkategorie, Übersicht, Transaktionen, Diagramme und Berichte.",
"guide.transactions.title":"Transaktionen","guide.transactions.body":"Transaktionen ist eine abgeleitete Ansicht, die Einnahmen und Ausgaben in einer durchsuchbaren und filterbaren Historie zusammenführt. Es handelt sich nicht um eine separate dritte Finanzdatenbank: Wenn Sie eine Einnahme oder Ausgabe hinzufügen oder bearbeiten, ändert sich die entsprechende Transaktionsansicht.",
"guide.savingsGoals.title":"Sparziele","guide.savingsGoals.body":"Erstellen Sie Sparziele mit Name, Zielbetrag, optionalem Zieldatum, aktuellem Betrag und Notizen. Verwenden Sie „Geld hinzufügen“, um Beiträge zu erfassen und den Fortschritt zu aktualisieren. Sparziele werden in der Übersicht und im Sparbericht zusammengefasst.",
"guide.reports.title":"Berichte","guide.reports.body":"Berichte bieten Ansichten für Monatsbudget, Einnahmen, Ausgaben, Ausgaben nach Kategorie, Geplant vs. Tatsächlich und Ersparnisse. Die Filter verwenden den jeweils passenden Monat, die Kategorie oder den Datumsbereich. CSV-Export ist in den Berichtsansichten verfügbar, die eine Schaltfläche zum CSV-Export anzeigen.",
"guide.settings.title":"Einstellungen","guide.settings.body":"In den Einstellungen verwalten Sie Profil, Währung, Datumsformat, ersten Wochentag, Warnschwelle für das Limit, Kategorien und Zahlungsmethoden. Dort finden Sie außerdem Beispieldaten, Neu Beginnen, Backup, Wiederherstellen, CSV-Exporte und Alle Daten zurücksetzen.",
"guide.demoData.title":"Beispieldaten","guide.demoData.body":"Beispieldaten laden ein realistisches Beispielbudget mit Einnahmen, geplanten Budgets, Ausgaben und Sparzielen aus den letzten Monaten, damit Sie App, Diagramme und Berichte erkunden können. Das Laden von Beispieldaten ersetzt die aktuellen Daten; daher erstellt die App vorher eine Sicherung, wenn dies erforderlich ist.",
"guide.startFresh.title":"Neu Beginnen","guide.startFresh.body":"Neu Beginnen versucht zuerst, ein JSON-Backup herunterzuladen, und löscht anschließend Einnahmen, Budgets, Ausgaben und Sparziele. Profil, Sprache, Kategorien, Zahlungsmethoden und andere App-Einstellungen bleiben erhalten. Wenn das Backup nicht heruntergeladen werden kann, wird Neu Beginnen nicht fortgesetzt.",
"guide.backupRestore.title":"Backup & Wiederherstellung","guide.backupRestore.body":"Backup Exportieren lädt die Anwendungsdaten als JSON-Backup-Datei herunter. Exportieren Sie regelmäßig Backups und bewahren Sie eine Kopie an einem sicheren Ort auf. Backup Importieren validiert die JSON-Datei, bevor die aktuellen App-Daten ersetzt werden, und fordert eine Bestätigung an. Die Spracheinstellung wird separat gespeichert und ist nicht Teil des JSON-Backups des App-Zustands.",
"guide.proTips.title":"Profi-Tipps","guide.proTips.body":"Legen Sie Ihr Monatsbudget vor Monatsbeginn fest. Prüfen Sie Budget regelmäßig, um Kategorien nahe am Limit zu erkennen. Verwenden Sie Notizen für hilfreiche Informationen. Exportieren Sie regelmäßig ein JSON-Backup, besonders vor dem Import eines anderen Backups, vor Neu Beginnen oder vor Alle Daten zurücksetzen.",
"guide.faq.title":"Häufig Gestellte Fragen",
"guide.faq.q1":"Werden meine Daten lokal gespeichert?","guide.faq.a1":"Ja. Die App läuft in Ihrem Browser und speichert die Anwendungsdaten lokal auf Ihrem Gerät im lokalen Browser-Speicher. Ihre Budgetdaten werden nicht an einen Server gesendet.",
"guide.faq.q2":"Was passiert, wenn ich den Browser schließe?","guide.faq.a2":"Die App speichert Änderungen normalerweise automatisch im lokalen Speicher. Ihre Daten sollten beim erneuten Öffnen der Datei im selben Browser auf demselben Gerät verfügbar bleiben. Exportieren Sie jedoch regelmäßig JSON-Backups, da lokaler Browser-Speicher nicht verfügbar sein, gelöscht werden oder verloren gehen kann.",
"guide.faq.q3":"Kann ich die App auf mehreren Geräten verwenden?","guide.faq.a3":"Ja, aber die Daten werden lokal pro Browser und Gerät gespeichert. Exportieren Sie auf einem Gerät ein JSON-Backup und importieren Sie es auf dem anderen, um Ihre App-Daten zu übertragen.",
"guide.faq.q4":"Wie werden Geplant, Tatsächlich, Verbleibend und % Verwendet berechnet?","guide.faq.a4":"Geplant ist der Budgetbetrag, den Sie für eine Kategorie und einen Monat festlegen. Tatsächlich ist die Summe der erfassten Ausgaben für diese Kategorie und diesen Monat. Verbleibend ist Geplant minus Tatsächlich. % Verwendet ist Tatsächlich geteilt durch Geplant; wenn kein positiver Plan vorhanden ist, zeigt die App keinen aussagekräftigen Prozentsatz an.",
"guide.faq.q5":"Löscht Neu Beginnen meine Sprache oder mein Profil?","guide.faq.a5":"Nein. Neu Beginnen löscht Einnahmen, Budgets, Ausgaben und Sparziele, nachdem erfolgreich ein Backup erstellt wurde. Profil, Sprache, Kategorien, Zahlungsmethoden und andere Einstellungen bleiben erhalten.",
"guide.faq.q6":"Benötige ich eine Internetverbindung?","guide.faq.a6":"Nein. Die Anwendung ist dafür ausgelegt, offline als eigenständige HTML-Datei zu funktionieren. Es sind kein Konto, kein Abonnement und keine Netzwerkverbindung erforderlich.",
 "guide.resetAllData.title":"Alle Daten zurücksetzen",
 "guide.resetAllData.body":"Alle Daten zurücksetzen versucht zuerst, ein JSON-Backup herunterzuladen, und stellt die App anschließend auf den Standardzustand zurück, einschließlich Profil, Einstellungen, Kategorien, Zahlungsmethoden, Einnahmen, Budgets, Ausgaben und Sparziele. Die gespeicherte Spracheinstellung wird ebenfalls auf Englisch zurückgesetzt. Wenn das Backup nicht heruntergeladen oder der neue Zustand nicht gespeichert werden kann, wird die Zurücksetzung nicht abgeschlossen.",
 "guide.faq.q7":"Wiederholt sich ein wöchentliches, zweiwöchentliches oder monatliches Einkommen automatisch?",
 "guide.faq.a7":"Nein. Die Häufigkeit wird als Information zum Einnahmeneintrag gespeichert. Die App erzeugt daraus nicht automatisch zukünftige Einnahmeneinträge.",
 "guide.faq.q8":"Was bewirkt Alle Daten zurücksetzen?",
 "guide.faq.a8":"Alle Daten zurücksetzen erstellt zuerst einen JSON-Backup-Download, stellt die App dann auf den Standardzustand zurück und setzt die gespeicherte Spracheinstellung auf Englisch. Im Unterschied zu Neu Beginnen werden dabei auch Profil, Kategorien, Zahlungsmethoden und andere Einstellungen entfernt.",
 "guide.resetAllData.title":"Alle Daten zurücksetzen",
 "guide.resetAllData.body":"Alle Daten zurücksetzen versucht zuerst, ein JSON-Backup herunterzuladen, und stellt die App anschließend auf den Standardzustand zurück, einschließlich Profil, Einstellungen, Kategorien, Zahlungsmethoden, Einnahmen, Budgets, Ausgaben und Sparziele. Die gespeicherte Spracheinstellung wird ebenfalls auf Englisch zurückgesetzt. Wenn das Backup nicht heruntergeladen oder der neue Zustand nicht gespeichert werden kann, wird die Zurücksetzung nicht abgeschlossen.",
 "guide.faq.q7":"Wiederholt sich ein wöchentliches, zweiwöchentliches oder monatliches Einkommen automatisch?",
 "guide.faq.a7":"Nein. Die Häufigkeit wird als Information zum Einnahmeneintrag gespeichert. Die App erzeugt daraus nicht automatisch zukünftige Einnahmeneinträge.",
