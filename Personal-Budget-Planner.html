let CURRENT_LANG = 'en';
(function loadLang(){
  try{
    const saved = localStorage.getItem(LANG_STORAGE_KEY);
    if(saved && SUPPORTED_LANGS.indexOf(saved) !== -1) CURRENT_LANG = saved;
  }catch(e){ console.warn('localStorage unavailable for language preference', e); }
})();
function t(key, vars){
  const table = I18N[CURRENT_LANG] || I18N.en;
  let str = (table && table[key] !== undefined) ? table[key] : ((I18N.en && I18N.en[key] !== undefined) ? I18N.en[key] : key);
  if(vars){ Object.keys(vars).forEach(k=>{ str = str.split('{'+k+'}').join(vars[k]); }); }
  return str;
}
/* Simple one/other pluralization helper, kept for parity with the established i18n architecture. */
function tc(baseKey, n, vars){
  const suffix = (Number(n) === 1) ? '.one' : '.other';
  return t(baseKey + suffix, Object.assign({n:n}, vars||{}));
}
function currentLangLocale(){ return LANG_LOCALE[CURRENT_LANG] || 'en-US'; }
function setLanguage(lang){
  if(SUPPORTED_LANGS.indexOf(lang) === -1) return;
  CURRENT_LANG = lang;
  try{ localStorage.setItem(LANG_STORAGE_KEY, lang); }catch(e){ console.warn('Could not persist language preference', e); }
  document.documentElement.lang = lang;
  const sel = document.getElementById('lang-select');
  if(sel && sel.value !== lang) sel.value = lang;
  if(typeof SAVE_OK !== 'undefined') setSaveIndicator(SAVE_OK);
  if(typeof refreshStaticChromeText === 'function') refreshStaticChromeText();
  renderApp();
  toast(t('common.toastLanguageChanged'),'success');
}

/* ============================================================
   PERSONAL BUDGET PLANNER — CORE DATA LAYER
   Single source of truth for all financial data, with the same
   generic CRUD / persistence architecture preserved from the
   YDC product family (STORE.load/save/mutate/render).
   ============================================================ */
const STORAGE_KEY = 'pbp_data_v1';
const APP_VERSION = 1;

/* ---------- ID / basic utils ---------- */
function uid(prefix){
  return (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
}
function localDateISO(d){
  const dt = d instanceof Date ? d : new Date(d);
  if(!(dt instanceof Date) || isNaN(dt.getTime())) return '';
  return [
    dt.getFullYear(),
    String(dt.getMonth() + 1).padStart(2, '0'),
    String(dt.getDate()).padStart(2, '0')
  ].join('-');
}
function todayISO(){ return localDateISO(new Date()); }
function nowISO(){ return new Date().toISOString(); }
function parseDateOnlyLocal(value){
  const v = String(value ?? '').trim();
  const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v);
  if(!match) return null;
  const y = Number(match[1]), m = Number(match[2]), d = Number(match[3]);
  const dt = new Date(y, m - 1, d);
  if(dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;
  return dt;
}
function calendarDayNumber(value){
  const dt = typeof value === 'string' ? parseDateOnlyLocal(value) : value;
  if(!(dt instanceof Date) || isNaN(dt.getTime())) return NaN;
  return Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate());
}
function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }
function sum(arr, fn){ return arr.reduce((a,x)=> a + (fn ? (Number(fn(x))||0) : (Number(x)||0)), 0); }
function round2(n){ return Math.round((Number(n)||0) * 100) / 100; }
function safeNum(n, fallback){ const v = Number(n); return (isFinite(v) && !isNaN(v)) ? v : (fallback||0); }
function groupBy(arr, fn){
  const m = new Map();
  arr.forEach(x=>{ const k = fn(x); if(!m.has(k)) m.set(k, []); m.get(k).push(x); });
  return m;
}
function escapeHtml(s){
  if(s === undefined || s === null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
/* Security boundary: use escapeHtml() whenever application/state data is
   interpolated into an HTML text node or attribute. Imported JSON is treated
   as untrusted state; validation happens before replacement and all rendered
   state values are escaped at the HTML sink. Never use user/state strings as
   executable markup, event-handler attributes, or script content. */
function debounce(fn, ms){
  let tmr = null;
  return function(...args){ clearTimeout(tmr); tmr = setTimeout(()=>fn.apply(this,args), ms); };
}
function bindSearchInput(el, selector, state, mountFn, delay=200){
  const input = el.querySelector(selector);
  if(!input) return;
  input.addEventListener('input', debounce(e=>{
    const searchInput = e.target;
    const hadFocus = document.activeElement === searchInput;
    const selectionStart = searchInput.selectionStart;
    const selectionEnd = searchInput.selectionEnd;
    state.q = searchInput.value;
    if(!searchInput.isConnected) return;
    mountFn(el);
    if(hadFocus){
      const restoredInput = el.querySelector(selector);
      if(restoredInput){
        restoredInput.focus({preventScroll:true});
        const caretStart = Math.min(selectionStart == null ? restoredInput.value.length : selectionStart, restoredInput.value.length);
        const caretEnd = Math.min(selectionEnd == null ? caretStart : selectionEnd, restoredInput.value.length);
        restoredInput.setSelectionRange(caretStart, caretEnd);
      }
    }
  }, delay));
}

/* ---------- Formatters (respect Settings) ---------- */
function currencySymbol(){ return (STORE.state.settings && STORE.state.settings.currencySymbol) || '$'; }
function fmtMoney(n){
  const v = safeNum(n, 0);
  const neg = v < 0;
  const abs = Math.abs(v);
  const str = abs.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
  // currencySymbol() is user-controlled profile data; escape it because
  // fmtMoney() is rendered into HTML in many cards/tables/reports.
  return (neg ? '-' : '') + escapeHtml(currencySymbol()) + str;
}
function fmtNum(n, decimals){
  const v = safeNum(n, 0);
  return v.toLocaleString(undefined, {minimumFractionDigits: decimals||0, maximumFractionDigits: decimals||0});
}
function fmtPct(n, decimals){
  const v = safeNum(n, 0);
  if(!isFinite(v)) return '—';
  return v.toFixed(decimals===undefined?1:decimals) + '%';
}
function fmtDate(isoDate){
  if(!isoDate) return '—';
  const fmt = (STORE.state.settings && STORE.state.settings.dateFormat) || 'MM/DD/YYYY';
  const parts = String(isoDate).slice(0,10).split('-');
  if(parts.length !== 3) return String(isoDate);
  const [y,m,d] = parts;
  if(fmt === 'DD/MM/YYYY') return `${d}/${m}/${y}`;
  if(fmt === 'YYYY-MM-DD') return `${y}-${m}-${d}`;
  return `${m}/${d}/${y}`;
}
function fmtDateTime(iso){
  if(!iso) return '—';
  try{
    const d = new Date(iso);
    if(isNaN(d.getTime())) return String(iso);
    return fmtDate(localDateISO(d)) + ' ' + d.toLocaleTimeString(currentLangLocale(),{hour:'2-digit',minute:'2-digit'});
  }catch(e){ return String(iso); }
}
function monthKey(isoDate){ return String(isoDate).slice(0,7); } // YYYY-MM
function monthLabel(key){
  const [y,m] = String(key).split('-').map(Number);
  const d = new Date(y, (m||1)-1, 1);
  return d.toLocaleDateString(currentLangLocale(),{month:'long', year:'numeric'});
}
function monthAdd(key, delta){
  const [y,m] = String(key).split('-').map(Number);
  const d = new Date(y, (m-1)+delta, 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function currentMonthKey(){ return monthKey(todayISO()); }

/* ---------- Default state shape (single source of truth) ---------- */
const DEFAULT_BUDGET_CATEGORIES = ['Housing','Utilities','Groceries','Transportation','Healthcare','Insurance','Debt','Shopping','Entertainment','Education','Personal','Savings','Other'];
const DEFAULT_PAYMENT_METHODS = ['Cash','Debit Card','Credit Card','Bank Transfer','Check','Mobile Payment','Other'];
const INCOME_TYPE_KEYS = [['Salary','income.typeSalary'],['Freelance','income.typeFreelance'],['Business','income.typeBusiness'],['Investment','income.typeInvestment'],['Gift','income.typeGift'],['Other','income.typeOther']];
const INCOME_FREQUENCY_KEYS = [['one-time','income.freqOneTime'],['weekly','income.freqWeekly'],['biweekly','income.freqBiweekly'],['monthly','income.freqMonthly']];

function seedCategories(){
  return DEFAULT_BUDGET_CATEGORIES.map(n => ({id: uid('cat'), name:n, archived:false}));
}
function seedPaymentMethods(){
  return DEFAULT_PAYMENT_METHODS.map((n,i) => ({id: uid('pm'), name:n, archived:false, isDefault: i===0}));
}

function defaultState(){
  return {
    meta: { version: APP_VERSION, createdAt: todayISO(), demoLoaded:false, onboarded:false, lastSaved:null },
    settings: {
      profileName: '',
      currencySymbol: '$',
      currencyCode: 'USD',
      dateFormat: 'MM/DD/YYYY',
      firstDayOfWeek: 0,          // 0=Sunday .. 6=Saturday
      nearLimitThresholdPct: 90,  // budget categories are flagged "Near Limit" at this % of planned
      disclaimerAcknowledged: false
    },
    income: [],
    budgets: [],       // one row per {monthKey, category}: {id, monthKey, category, planned, notes}
    expenses: [],
    savingsGoals: [],  // {id, name, targetAmount, currentAmount, targetDate, notes, contributions:[{id,date,amount}]}
    paymentMethods: seedPaymentMethods(),
    categories: seedCategories(),

  };
}

const STATE_ARRAY_KEYS = ['income','budgets','expenses','savingsGoals','paymentMethods','categories'];

/* ---------- Backup validation ---------- */
function normalizeBudgetCategory(category){
  return String(category ?? '').trim().toLocaleLowerCase();
}
function budgetIdentityKey(monthKeyVal, category){
  return String(monthKeyVal ?? '').trim() + '::' + normalizeBudgetCategory(category);
}
function findDuplicateBudget(budgets, candidate, excludeId){
  const key = budgetIdentityKey(candidate.monthKey, candidate.category);
  return (Array.isArray(budgets) ? budgets : []).find(b=>{
    if(!b || (excludeId != null && String(b.id) === String(excludeId))) return false;
    return budgetIdentityKey(b.monthKey, b.category) === key;
  }) || null;
}
function findBudgetIntegrityIssues(budgets){
  const issues = [];
  const seen = new Map();
  (Array.isArray(budgets) ? budgets : []).forEach((b, index)=>{
    if(!b || typeof b !== 'object') return;
    const key = budgetIdentityKey(b.monthKey, b.category);
    if(seen.has(key)){
      issues.push({index, duplicateOf:seen.get(key), monthKey:String(b.monthKey ?? '').trim(), category:String(b.category ?? '').trim()});
    }else{
      seen.set(key, index);
    }
  });
  return issues;
}
function isPlainObject(v){
  if(v===null || typeof v!=='object') return false;
  const proto = Object.getPrototypeOf(v);
  return proto===Object.prototype || proto===null;
}
function hasDangerousKey(obj){
  if(!isPlainObject(obj)) return false;
  return Object.keys(obj).some(k=>k==='__proto__' || k==='constructor' || k==='prototype');
}
function isValidRecordId(v){
  return typeof v==='string' && v.trim()!=='' && v.length<=200 && !/[\u0000-\u001F\u007F]/.test(v);
}
function isValidStringField(v, maxLen){
  return typeof v==='string' && v.trim()!=='' && v.length<=maxLen && !/[\u0000-\u001F\u007F]/.test(v);
}
function isValidOptionalString(v, maxLen){
  return v===undefined || v===null || (typeof v==='string' && v.length<=maxLen && !/[\u0000-\u001F\u007F]/.test(v));
}
function isFiniteNumberValue(v){
  if(typeof v==='number') return Number.isFinite(v);
  if(typeof v==='string' && v.trim()!=='') return Number.isFinite(Number(v));
  return false;
}
function isValidNotesString(v, maxLen){
  return v===undefined || v===null || (typeof v==='string' && v.length<=maxLen && !/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/.test(v));
}
function isValidBackupAmount(v, allowZero){
  if(!isFiniteNumberValue(v)) return false;
  const n = Number(v);
  return allowZero ? n>=0 : n>0;
}
function isValidMonthKey(v){
  if(typeof v!=='string' || !/^\d{4}-\d{2}$/.test(v)) return false;
  const parts=v.split('-').map(Number);
  return parts[1]>=1 && parts[1]<=12;
}
function isValidBackupTimestamp(v){
  if(v===undefined || v===null || v==='') return true;
  if(typeof v!=='string' || v.length>100) return false;
  const d=new Date(v);
  return Number.isFinite(d.getTime());
}
function validateStateShape(obj){
  const errors=[];
  const fail=(key, vars={})=>errors.push(t(key,vars));
  if(!isPlainObject(obj) || hasDangerousKey(obj)) return [t('backup.invalidData')];
  if(!isPlainObject(obj.meta) || hasDangerousKey(obj.meta)) fail('backup.invalidMeta');
  if(!isPlainObject(obj.settings) || hasDangerousKey(obj.settings)) fail('backup.missingSettings');

  // The six collections are part of the backup contract. Individual fields inside
  // records remain forward-compatible: optional fields may be absent and are
  // supplied by migrateState() after validation succeeds.
  STATE_ARRAY_KEYS.forEach(k=>{
    if(!Array.isArray(obj[k])) fail('backup.missingList',{k:k});
  });
  if(errors.length) return errors;

  const checkArrayRecords=(key, validator)=>{
    const arr=obj[key];
    const ids=new Set();
    arr.forEach((rec,index)=>{
      if(!isPlainObject(rec) || hasDangerousKey(rec)){
        fail('backup.invalidRecord',{collection:t('backup.collection.'+key),index:index+1,reason:t('backup.reason.recordObject')});
        return;
      }
      if(!isValidRecordId(rec.id)){
        fail('backup.invalidRecord',{collection:t('backup.collection.'+key),index:index+1,reason:t('backup.reason.id')});
      }else if(ids.has(rec.id)){
        fail('backup.invalidRecord',{collection:t('backup.collection.'+key),index:index+1,reason:t('backup.reason.duplicateId')});
      }else ids.add(rec.id);
      validator(rec,index);
    });
  };

  // meta/settings: known fields are type-checked when present, but missing
  // optional fields remain migratable for older backups.
  if(isPlainObject(obj.meta)){
    if(obj.meta.version!==undefined && obj.meta.version!==null && !(typeof obj.meta.version==='number' ? Number.isFinite(obj.meta.version) : isValidOptionalString(obj.meta.version,100))) fail('backup.invalidMeta');
    if(obj.meta.createdAt!==undefined && !isValidBackupTimestamp(obj.meta.createdAt)) fail('backup.invalidMeta');
    if(obj.meta.lastSaved!==undefined && obj.meta.lastSaved!==null && !isValidBackupTimestamp(obj.meta.lastSaved)) fail('backup.invalidMeta');
    ['demoLoaded','onboarded'].forEach(k=>{ if(obj.meta[k]!==undefined && typeof obj.meta[k]!=='boolean') fail('backup.invalidMeta'); });
  }
  if(isPlainObject(obj.settings)){
    if(!isValidOptionalString(obj.settings.profileName,200)) fail('backup.invalidSettings');
    if(!isValidOptionalString(obj.settings.currencySymbol,20)) fail('backup.invalidSettings');
    if(!isValidOptionalString(obj.settings.currencyCode,10)) fail('backup.invalidSettings');
    if(obj.settings.dateFormat!==undefined && !['MM/DD/YYYY','DD/MM/YYYY','YYYY-MM-DD'].includes(obj.settings.dateFormat)) fail('backup.invalidSettings');
    if(obj.settings.firstDayOfWeek!==undefined && !(Number.isInteger(obj.settings.firstDayOfWeek) && obj.settings.firstDayOfWeek>=0 && obj.settings.firstDayOfWeek<=6)) fail('backup.invalidSettings');
    if(obj.settings.nearLimitThresholdPct!==undefined && !(isFiniteNumberValue(obj.settings.nearLimitThresholdPct) && Number(obj.settings.nearLimitThresholdPct)>=1 && Number(obj.settings.nearLimitThresholdPct)<=100)) fail('backup.invalidSettings');
    if(obj.settings.disclaimerAcknowledged!==undefined && typeof obj.settings.disclaimerAcknowledged!=='boolean') fail('backup.invalidSettings');
  }

  checkArrayRecords('income',(r)=>{
    if(!isValidDate(r.date)) fail('backup.invalidRecord',{collection:t('backup.collection.income'),index:'',reason:t('backup.reason.date')});
    if(!isValidBackupAmount(r.amount,true)) fail('backup.invalidRecord',{collection:t('backup.collection.income'),index:'',reason:t('backup.reason.amount')});
    if(!isValidStringField(r.source,300)) fail('backup.invalidRecord',{collection:t('backup.collection.income'),index:'',reason:t('backup.reason.source')});
    if(r.frequency!==undefined && (typeof r.frequency!=='string' || !INCOME_FREQUENCY_KEYS.some(x=>x[0]===r.frequency))) fail('backup.invalidRecord',{collection:t('backup.collection.income'),index:'',reason:t('backup.reason.frequency')});
    if(r.type!==undefined && (typeof r.type!=='string' || !INCOME_TYPE_KEYS.some(x=>x[0]===r.type))) fail('backup.invalidRecord',{collection:t('backup.collection.income'),index:'',reason:t('backup.reason.type')});
    if(!isValidNotesString(r.notes,2000)) fail('backup.invalidRecord',{collection:t('backup.collection.income'),index:'',reason:t('backup.reason.notes')});
    if(!isValidBackupTimestamp(r.createdAt) || !isValidBackupTimestamp(r.updatedAt)) fail('backup.invalidRecord',{collection:t('backup.collection.income'),index:'',reason:t('backup.reason.timestamp')});
  });

  checkArrayRecords('budgets',(r)=>{
    if(!isValidMonthKey(r.monthKey)) fail('backup.invalidRecord',{collection:t('backup.collection.budgets'),index:'',reason:t('backup.reason.monthKey')});
    if(!isValidStringField(r.category,200)) fail('backup.invalidRecord',{collection:t('backup.collection.budgets'),index:'',reason:t('backup.reason.category')});
    if(!isValidBackupAmount(r.planned,true)) fail('backup.invalidRecord',{collection:t('backup.collection.budgets'),index:'',reason:t('backup.reason.amount')});
    if(!isValidNotesString(r.notes,2000)) fail('backup.invalidRecord',{collection:t('backup.collection.budgets'),index:'',reason:t('backup.reason.notes')});
  });

  checkArrayRecords('expenses',(r)=>{
    if(!isValidDate(r.date)) fail('backup.invalidRecord',{collection:t('backup.collection.expenses'),index:'',reason:t('backup.reason.date')});
    if(!isValidStringField(r.description,500)) fail('backup.invalidRecord',{collection:t('backup.collection.expenses'),index:'',reason:t('backup.reason.description')});
    if(!isValidStringField(r.category,200)) fail('backup.invalidRecord',{collection:t('backup.collection.expenses'),index:'',reason:t('backup.reason.category')});
    if(!isValidBackupAmount(r.amount,true)) fail('backup.invalidRecord',{collection:t('backup.collection.expenses'),index:'',reason:t('backup.reason.amount')});
    if(r.paymentMethodId!==undefined && r.paymentMethodId!==null && typeof r.paymentMethodId!=='string') fail('backup.invalidRecord',{collection:t('backup.collection.expenses'),index:'',reason:t('backup.reason.paymentMethod')});
    if(!isValidNotesString(r.notes,2000)) fail('backup.invalidRecord',{collection:t('backup.collection.expenses'),index:'',reason:t('backup.reason.notes')});
    if(!isValidBackupTimestamp(r.createdAt) || !isValidBackupTimestamp(r.updatedAt)) fail('backup.invalidRecord',{collection:t('backup.collection.expenses'),index:'',reason:t('backup.reason.timestamp')});
  });

  checkArrayRecords('savingsGoals',(r)=>{
    if(!isValidStringField(r.name,300)) fail('backup.invalidRecord',{collection:t('backup.collection.savingsGoals'),index:'',reason:t('backup.reason.name')});
    if(!isValidBackupAmount(r.targetAmount,false)) fail('backup.invalidRecord',{collection:t('backup.collection.savingsGoals'),index:'',reason:t('backup.reason.targetAmount')});
    if(r.currentAmount!==undefined && r.currentAmount!==null && (!isFiniteNumberValue(r.currentAmount) || Number(r.currentAmount)<0)) fail('backup.invalidRecord',{collection:t('backup.collection.savingsGoals'),index:'',reason:t('backup.reason.currentAmount')});
    if(r.targetDate!==undefined && r.targetDate!==null && r.targetDate!=='' && !isValidDate(r.targetDate)) fail('backup.invalidRecord',{collection:t('backup.collection.savingsGoals'),index:'',reason:t('backup.reason.targetDate')});
    if(r.contributions!==undefined && !Array.isArray(r.contributions)) fail('backup.invalidRecord',{collection:t('backup.collection.savingsGoals'),index:'',reason:t('backup.reason.contributions')});
    if(Array.isArray(r.contributions)){
      const contribIds=new Set();
      r.contributions.forEach((c,ci)=>{
        if(!isPlainObject(c) || hasDangerousKey(c) || !isValidRecordId(c.id)){
          fail('backup.invalidRecord',{collection:t('backup.collection.savingsGoals'),index:'',reason:t('backup.reason.contribution')}); return;
        }
        if(contribIds.has(c.id)) fail('backup.invalidRecord',{collection:t('backup.collection.savingsGoals'),index:'',reason:t('backup.reason.duplicateContributionId')});
        contribIds.add(c.id);
        if(!isValidDate(c.date)) fail('backup.invalidRecord',{collection:t('backup.collection.savingsGoals'),index:'',reason:t('backup.reason.contributionDate')});
        if(!isValidBackupAmount(c.amount,false)) fail('backup.invalidRecord',{collection:t('backup.collection.savingsGoals'),index:'',reason:t('backup.reason.contributionAmount')});
      });
    }
    if(!isValidNotesString(r.notes,2000)) fail('backup.invalidRecord',{collection:t('backup.collection.savingsGoals'),index:'',reason:t('backup.reason.notes')});
    if(!isValidBackupTimestamp(r.createdAt) || !isValidBackupTimestamp(r.updatedAt)) fail('backup.invalidRecord',{collection:t('backup.collection.savingsGoals'),index:'',reason:t('backup.reason.timestamp')});
  });

  checkArrayRecords('categories',(r)=>{
    if(!isValidStringField(r.name,200)) fail('backup.invalidRecord',{collection:t('backup.collection.categories'),index:'',reason:t('backup.reason.name')});
    if(r.archived!==undefined && typeof r.archived!=='boolean') fail('backup.invalidRecord',{collection:t('backup.collection.categories'),index:'',reason:t('backup.reason.archived')});
  });

  checkArrayRecords('paymentMethods',(r)=>{
    if(!isValidStringField(r.name,200)) fail('backup.invalidRecord',{collection:t('backup.collection.paymentMethods'),index:'',reason:t('backup.reason.name')});
    if(r.archived!==undefined && typeof r.archived!=='boolean') fail('backup.invalidRecord',{collection:t('backup.collection.paymentMethods'),index:'',reason:t('backup.reason.archived')});
  });

  const budgetIssues=findBudgetIntegrityIssues(obj.budgets);
  if(budgetIssues.length) fail('backup.invalidRecord',{collection:t('backup.collection.budgets'),index:'',reason:t('backup.reason.duplicateBudget')});

  return errors;
}

/* ---------- Central store ---------- */
const STORE = {
  state: null,
  load(){
    let raw = null;
    let storageReadOk = true;
    try{ raw = localStorage.getItem(STORAGE_KEY); }
    catch(e){ storageReadOk = false; console.warn('localStorage unavailable', e); }
    if(raw){
      let parsed = null;
      try{ parsed = JSON.parse(raw); }
      catch(e){ console.warn('Stored data was corrupted JSON, starting fresh.', e); }
      if(parsed && validateStateShape(parsed).length === 0){
        this.state = migrateState(parsed);
        setSaveIndicator(true);
        return;
      }
    }
    this.state = defaultState();
    setSaveIndicator(storageReadOk ? null : false);
  },
  save(){
    const previousLastSaved = this.state && this.state.meta ? this.state.meta.lastSaved : null;
    try{
      const savedAt = nowISO();
      this.state.meta.lastSaved = savedAt;
      const payload = JSON.stringify(this.state);
      localStorage.setItem(STORAGE_KEY, payload);
      const persisted = localStorage.getItem(STORAGE_KEY);
      if(persisted !== payload) throw new Error('localStorage verification failed');
      setSaveIndicator(true);
      return true;
    }catch(e){
      if(this.state && this.state.meta) this.state.meta.lastSaved = previousLastSaved;
      console.error('Failed to save to localStorage', e);
      setSaveIndicator(false);
      toast(t('backup.saveFailedWarning'), 'error');
      return false;
    }
  },
  mutate(fn){
    let before = null;
    try{
      before = JSON.stringify(this.state);
      fn(this.state);
    }catch(e){
      console.error('Mutation failed', e);
      if(before){ try{ this.state = JSON.parse(before); }catch(_){ } }
      toast(t('backup.saveFailedWarning'), 'error');
      this.render();
      return false;
    }
    const saved = this.save();
    if(!saved && before){
      try{ this.state = JSON.parse(before); }catch(e){ console.error('Could not restore state after failed save', e); }
    }
    this.render();
    return saved;
  },
  render(){ renderApp(); }
};

function migrateState(obj){
  // Only call this after validateStateShape() succeeds. Migration fills optional
  // fields from the current defaults without repairing/replacing invalid records.
  const base = defaultState();
  const out = Object.assign({}, base, obj);
  STATE_ARRAY_KEYS.forEach(k=>{ if(!Array.isArray(out[k])) out[k] = base[k]; });
  out.settings = Object.assign({}, base.settings, obj.settings||{});
  out.meta = Object.assign({}, base.meta, obj.meta||{});

  out.income.forEach(r=>{
    if(r.frequency===undefined) r.frequency='one-time';
    if(r.type===undefined) r.type='Other';
    if(r.notes===undefined || r.notes===null) r.notes='';
  });
  out.budgets.forEach(r=>{ if(r.notes===undefined || r.notes===null) r.notes=''; });
  out.expenses.forEach(r=>{
    if(r.paymentMethodId===undefined || r.paymentMethodId===null) r.paymentMethodId='';
    if(r.notes===undefined || r.notes===null) r.notes='';
  });
  out.savingsGoals.forEach(g=>{
    if(g.currentAmount===undefined || g.currentAmount===null) g.currentAmount=0;
    if(g.targetDate===undefined || g.targetDate===null) g.targetDate='';
    if(g.notes===undefined || g.notes===null) g.notes='';
    if(!Array.isArray(g.contributions)) g.contributions=[];
  });
  out.categories.forEach(c=>{ if(c.archived===undefined) c.archived=false; });
  out.paymentMethods.forEach(p=>{ if(p.archived===undefined) p.archived=false; });
  if(!out.categories.length) out.categories = base.categories;
  if(!out.paymentMethods.length) out.paymentMethods = base.paymentMethods;

  // Enforce the budget invariant on previously stored/legacy data as well.
  // Import validation rejects duplicates; this remains for legacy local state.
  const seenBudgetKeys = new Set();
  out.budgets = out.budgets.filter(b=>{
    const key = budgetIdentityKey(b.monthKey, b.category);
    if(seenBudgetKeys.has(key)) return false;
    seenBudgetKeys.add(key);
    return true;
  });
  return out;
}

let SAVE_OK = null;
function setSaveIndicator(ok){
  SAVE_OK = ok;
  const el = document.getElementById('save-indicator');
  if(!el) return;
  if(ok === true){
    const timeStr = new Date().toLocaleTimeString(currentLangLocale(),{hour:'2-digit',minute:'2-digit'});
    el.innerHTML = `<span class="save-dot ok"></span> ${escapeHtml(t('shell.savedAt',{time:timeStr}))}`;
    el.classList.remove('save-error');
  } else if(ok === false){
    el.innerHTML = `<span class="save-dot err"></span> ${escapeHtml(t('shell.notSaved'))}`;
    el.classList.add('save-error');
  } else {
    el.innerHTML = `<span class="save-dot err"></span> ${escapeHtml(t('shell.notSavedYet'))}`;
    el.classList.add('save-error');
  }
}

/* ---------- Generic CRUD helpers (all collections) ---------- */
function addRecord(arrName, record){
  record.id = record.id || uid(arrName);
  record.createdAt = record.createdAt || nowISO();
  record.updatedAt = nowISO();
  const saved = STORE.mutate(s => s[arrName].push(record));
  return saved ? record.id : null;
}
function updateRecord(arrName, id, patch){
  let found = false;
  const saved = STORE.mutate(s=>{
    const rec = s[arrName].find(r=>r.id===id);
    if(rec){ found = true; Object.assign(rec, patch, {updatedAt: nowISO()}); }
  });
  return found && saved;
}
function deleteRecord(arrName, id){
  const beforeCount = (STORE.state[arrName]||[]).length;
  const saved = STORE.mutate(s=>{ s[arrName] = s[arrName].filter(r=>r.id!==id); });
  return saved && (STORE.state[arrName]||[]).length < beforeCount;
}
function getRecord(arrName, id){
  return (STORE.state[arrName]||[]).find(r=>r.id===id) || null;
}

/* ---------- Validation helpers ---------- */
function isBlank(v){ return v===undefined || v===null || String(v).trim()===''; }
function isValidAmount(v){
  if(typeof v==='number') return Number.isFinite(v) && round2(v)>0;
  if(typeof v!=='string' || v.trim()==='') return false;
  const n = Number(v.trim());
  return Number.isFinite(n) && round2(n)>0;
}
function isValidNonNegativeAmount(v){
  if(typeof v==='number') return Number.isFinite(v) && round2(v)>=0;
  if(typeof v!=='string' || v.trim()==='') return false;
  const n = Number(v.trim());
  return Number.isFinite(n) && round2(n)>=0;
}
function isValidPositiveAmount(v){
  return isValidAmount(v);
}
function isValidDate(v){
  return !!parseDateOnlyLocal(v);
}
function validateCustomDateRange(start, end){
  const errors = [];
  const validStart = isValidDate(start);
  const validEnd = isValidDate(end);
  if(!validStart) errors.push(t('val.customRangeStartInvalid'));
  if(!validEnd) errors.push(t('val.customRangeEndInvalid'));
  if(validStart && validEnd && String(end) < String(start)) errors.push(t('val.customRangeOrderInvalid'));
  return errors;
}
function customRangeValidationHtml(pageKey){
  const st = UI_STATE[pageKey];
  const errors = validateCustomDateRange(st.customStart, st.customEnd);
  if(!errors.length) return '';
  return `<div class="alert alert-info" style="margin-top:12px;"><span class="ic">&#8505;</span><div><strong>${escapeHtml(t('dateRange.invalidRangeTitle'))}</strong> ${escapeHtml(errors[0])}</div></div>`;
}
function renderInvalidRangeState(el, pageKey, onChange){
  el.innerHTML = `${rangeFilterBar(pageKey)}${customRangeValidationHtml(pageKey)}`;
  wireRangeFilterBar(el, pageKey, onChange);
}

/* ============================================================
   DATE RANGE RESOLUTION — respects the user's First Day of Week
   setting from Settings/Profile.
   ============================================================ */
function resolveDateRange(key, customStart, customEnd){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  const iso = dt => localDateISO(dt);
  const startOfDay = new Date(y,m,d);
  const fdow = (STORE.state.settings && Number.isFinite(STORE.state.settings.firstDayOfWeek)) ? STORE.state.settings.firstDayOfWeek : 0;
  switch(key){
    case 'today': return { start: iso(startOfDay), end: iso(startOfDay) };
    case 'this-week': {
      const dow = startOfDay.getDay();
      const offset = (dow - fdow + 7) % 7;
      const start = new Date(startOfDay); start.setDate(startOfDay.getDate() - offset);
      const end = new Date(start); end.setDate(start.getDate()+6);
      return { start: iso(start), end: iso(end) };
    }
    case 'this-month': return { start: iso(new Date(y,m,1)), end: iso(new Date(y,m+1,0)) };
    case 'last-month': return { start: iso(new Date(y,m-1,1)), end: iso(new Date(y,m,0)) };
    case 'this-quarter': {
      const q = Math.floor(m/3);
      return { start: iso(new Date(y,q*3,1)), end: iso(new Date(y,q*3+3,0)) };
    }
    case 'this-year': return { start: iso(new Date(y,0,1)), end: iso(new Date(y,11,31)) };
    case 'all': return { start: '0000-01-01', end: '9999-12-31' };
    case 'custom': return { start: customStart || iso(new Date(y,0,1)), end: customEnd || iso(startOfDay) };
    default: return { start: iso(new Date(y,0,1)), end: iso(new Date(y,11,31)) };
  }
}
function inRange(dateStr, start, end){
  const d = String(dateStr).slice(0,10);
  return d >= start && d <= end;
}

function nearLimitThreshold(){ return safeNum(STORE.state.settings.nearLimitThresholdPct, 90); }
function budgetStatusFor(planned, actual){
  planned = safeNum(planned); actual = safeNum(actual);
  if(planned <= 0){ return actual > 0 ? 'over' : 'under'; }
  if(actual > planned) return 'over';
  const pct = (actual/planned)*100;
  if(pct >= nearLimitThreshold()) return 'near';
  return 'under';
}
function budgetStatusLabel(status){
  const map = {under:'status.under', near:'status.near', over:'status.over'};
  return t(map[status] || 'status.under');

/* Builds one row per category that has either a planned budget or actual spending this month. */
function budgetRowsForMonth(mk){
  const budgeted = budgetsForMonth(mk);
  const spentByCat = new Map();
  expensesForMonth(mk).forEach(e=>{ spentByCat.set(e.category, round2(safeNum(spentByCat.get(e.category)) + safeNum(e.amount))); });

  // Build the reportable category set from all three sources:
  // active categories, saved budget rows, and actual spending. This preserves
  // historical/archived categories instead of silently dropping their budgets.
  const cats = new Set();
  activeCategories().forEach(c=>cats.add(c.name));
  budgeted.forEach(b=>cats.add(b.category));
  spentByCat.forEach((_, cat)=>cats.add(cat));

  const rows = [];
  cats.forEach(cat=>{
    const b = budgeted.find(x=>x.category===cat);
    const planned = b ? safeNum(b.planned) : 0;
    const actual = safeNum(spentByCat.get(cat));

    // Do not clutter the table with an untouched active category, but always
    // retain categories that have an explicit budget or actual spending.
    if(!b && actual===0) return;

    const remaining = round2(planned - actual);
    const pctUsed = planned>0 ? round2((actual/planned)*100) : null;
    rows.push({
      category:cat,
      budgetId:b?b.id:null,
      planned:round2(planned),
      actual:round2(actual),
      remaining,
      pctUsed,
      status:budgetStatusFor(planned, actual)
    });
  });

  return rows.sort((a,b)=>a.category.localeCompare(b.category));
}
function overallBudgetStatusForMonth(mk){
  const planned = totalPlannedForMonth(mk), actual = totalActualForMonth(mk);
  return budgetStatusFor(planned, actual);
}

/* ---------- Savings goals ----------
   currentAmount is the maintained goal balance (not a derived field).
   Each valid contribution is stored in contributions[] AND increases
   currentAmount by the same rounded amount. Existing contribution history
   is preserved. When editing a goal, currentAmount cannot be reduced below
   the sum of its recorded contributions, preventing a silent history/balance
   mismatch. Overfunding remains supported: currentAmount may exceed target.
*/
function savingsContributionTotal(goal){
  if(!goal || !Array.isArray(goal.contributions)) return 0;
  return round2(sum(goal.contributions, c=>safeNum(c.amount)));
}
function validateGoalInput(data, existingGoal){
  const errors = [];
  if(isBlank(data.name)) errors.push(t('val.goalNameRequired'));
  if(!isValidPositiveAmount(data.targetAmount)) errors.push(t('val.targetInvalid'));
  if(!isValidNonNegativeAmount(data.currentAmount)) errors.push(t('val.currentAmountInvalid'));
  if(data.targetDate!==undefined && data.targetDate!==null && data.targetDate!=='' && !isValidDate(data.targetDate)) errors.push(t('val.dateInvalid'));
  if(existingGoal && isValidNonNegativeAmount(data.currentAmount)){
    const contributionTotal = savingsContributionTotal(existingGoal);
    if(round2(safeNum(data.currentAmount)) < contributionTotal){
      errors.push(t('val.currentAmountBelowContributions'));
    }
  }
  return errors;
}
function createSavingsGoal(data){
  const errors = validateGoalInput(data);
  if(errors.length) return {ok:false, errors};
  const id = addRecord('savingsGoals', {
    name: String(data.name).trim(), targetAmount: round2(safeNum(data.targetAmount)),
    currentAmount: round2(safeNum(data.currentAmount)), targetDate: data.targetDate || '',
    notes: String(data.notes||'').trim(), contributions: []
  });
  return id ? {ok:true, id} : {ok:false, errors:[t('backup.saveFailedWarning')]};
}
function updateSavingsGoalRecord(id, data){
  const existing = getRecord('savingsGoals', id);
  const errors = validateGoalInput(data, existing);
  if(errors.length) return {ok:false, errors};
  if(!updateRecord('savingsGoals', id, {
    name: String(data.name).trim(), targetAmount: round2(safeNum(data.targetAmount)),
    currentAmount: round2(safeNum(data.currentAmount)), targetDate: data.targetDate || '', notes: String(data.notes||'').trim()
  })) return {ok:false, errors:[t('backup.saveFailedWarning')]};
  return {ok:true, id};
}
function deleteSavingsGoal(id){ return deleteRecord('savingsGoals', id); }
function addSavingsContribution(goalId, amount, date){
  if(!isValidPositiveAmount(amount)) return {ok:false, errors:[t('val.fundAmountInvalid')]};
  if(!isValidDate(date)) return {ok:false, errors:[t('val.dateInvalid')]};
  const goal = getRecord('savingsGoals', goalId);
  if(!goal) return {ok:false, errors:[t('val.recordNotFound')]};
  if(round2(safeNum(goal.currentAmount)) < savingsContributionTotal(goal)){
    return {ok:false, errors:[t('val.currentAmountBelowContributions')]};
  }
  const contributionAmount = round2(safeNum(amount));
  const saved = STORE.mutate(s=>{
    const g = s.savingsGoals.find(x=>x.id===goalId);
    if(!g) return;
    if(!Array.isArray(g.contributions)) g.contributions = [];
    g.contributions.push({id:uid('contrib'), date, amount: contributionAmount});
    // currentAmount is the goal's maintained balance; every valid contribution
    // increases that balance and is recorded in contribution history.
    g.currentAmount = round2(safeNum(g.currentAmount) + contributionAmount);
    g.updatedAt = nowISO();
  });
  return saved ? {ok:true} : {ok:false, errors:[t('backup.saveFailedWarning')]};
}
function goalStatus(g){
  const target = safeNum(g.targetAmount), current = safeNum(g.currentAmount);
  if(target>0 && current>=target) return 'completed';
  if(g.targetDate){
    const targetDay = calendarDayNumber(g.targetDate);
    const todayDay = calendarDayNumber(todayISO());
    const daysLeft = (Number.isFinite(targetDay) && Number.isFinite(todayDay))
      ? (targetDay - todayDay) / 86400000
      : NaN;
    const pctDone = target>0 ? current/target : 0;
    if(daysLeft>=0 && daysLeft<=30 && pctDone<0.85) return 'behind';
  }
  return 'onTrack';
}
function goalPct(g){ const target = safeNum(g.targetAmount); return target>0 ? clamp(round2((safeNum(g.currentAmount)/target)*100),0,100) : 0; }
function savingsTotals(){
  const goals = STORE.state.savingsGoals;
  return { totalCurrent: round2(sum(goals, g=>safeNum(g.currentAmount))), totalTarget: round2(sum(goals, g=>safeNum(g.targetAmount))) };
}

function currentMonthKeySafe(){ try{ return monthKey(todayISO()); }catch(e){ return localDateISO(new Date()).slice(0,7); } }
function activeRange(pageKey){

  if(st.range==='custom' && validateCustomDateRange(st.customStart, st.customEnd).length) return null;
  return resolveDateRange(st.range, st.customStart, st.customEnd);

    ['this-quarter',t('dateRange.thisQuarter')],['this-year',t('dateRange.thisYear')],
    ['today',t('dateRange.today')],['this-week',t('dateRange.thisWeek')],
    ['all',t('dateRange.allTime')],['custom',t('dateRange.customRange')]
  ];

function rangeFilterBar(pageKey){
  const st = UI_STATE[pageKey];
  const opts = dateFilterOptions().map(([v,l])=>`<option value="${v}" ${st.range===v?'selected':''}>${escapeHtml(l)}</option>`).join('');
  const customVisible = st.range==='custom';
  return `<div class="row wrap" style="gap:8px;">
    <select class="range-select" data-page="${pageKey}" aria-label="${escapeHtml(t('dateRange.filterAria'))}" style="width:auto;">${opts}</select>

      <input type="date" class="range-start" data-page="${pageKey}" aria-label="${escapeHtml(t('dateRange.startAria'))}" value="${escapeHtml(st.customStart||'')}" style="width:auto;">
      <input type="date" class="range-end" data-page="${pageKey}" aria-label="${escapeHtml(t('dateRange.endAria'))}" value="${escapeHtml(st.customEnd||'')}" style="width:auto;">

function wireRangeFilterBar(el, pageKey, onChange){
  const sel = el.querySelector('.range-select');
  if(!sel) return;
  sel.addEventListener('change', ()=>{
    const next = sel.value;
    if(next==='custom'){
      UI_STATE[pageKey].range = 'custom';
      onChange();
      return;
    }
    UI_STATE[pageKey].range = next;
    onChange();
  });
  const s = el.querySelector('.range-start'), e = el.querySelector('.range-end');
  const commitCustomRange = ()=>{
    const start = s ? s.value : UI_STATE[pageKey].customStart;
    const end = e ? e.value : UI_STATE[pageKey].customEnd;
    const errors = validateCustomDateRange(start, end);
    if(errors.length){
      toast(errors[0], 'error');
      return;
    }
    UI_STATE[pageKey].customStart = start;
    UI_STATE[pageKey].customEnd = end;
    UI_STATE[pageKey].range = 'custom';
    onChange();
  };
  if(s) s.addEventListener('change', commitCustomRange);
  if(e) e.addEventListener('change', commitCustomRange);
}

let MODAL_LAST_FOCUS = null;
function openModal(cfg){
  const root = document.getElementById('modal-root');
  const box = document.getElementById('modal-box');

    ${cfg.footerHtml ? `<div class="modal-footer">${cfg.footerHtml}</div>` : ''}
  `;

function closeModal(){
  const root = document.getElementById('modal-root');
  if(!root || !root.classList.contains('open')) return;
  root.classList.remove('open');
  root.setAttribute('aria-hidden','true');
  document.getElementById('modal-box').innerHTML = '';
  if(MODAL_LAST_FOCUS && typeof MODAL_LAST_FOCUS.focus === 'function' && MODAL_LAST_FOCUS.isConnected){
    MODAL_LAST_FOCUS.focus({preventScroll:true});
  }
  MODAL_LAST_FOCUS = null;

document.addEventListener('click', (e)=>{
  if(e.target.closest && e.target.closest('[data-close-modal]')) { closeModal(); return; }
  const root=document.getElementById('modal-root');
  if(root && root.classList.contains('open') && e.target===root) closeModal();
}, false);
document.addEventListener('click', (e)=>{
  const btn=e.target.closest ? e.target.closest('button') : null;
  if(!btn || !btn.closest || !btn.closest('#modal-box')) return;
  if(btn.hasAttribute('data-close-modal')) return;
  const id=btn.id||'';
  if(!/(?:save|fund)/i.test(id)) return;
  if(!uxButtonLock(btn)){
    e.preventDefault();
    e.stopImmediatePropagation();
  }
}, true);
document.addEventListener('keydown', (e)=>{
  const modalRoot = document.getElementById('modal-root');
  const sidebar = document.getElementById('sidebar');
  if(e.key==='Escape' && sidebar && sidebar.classList.contains('open') && !(modalRoot && modalRoot.classList.contains('open'))){
    e.preventDefault();
    closeSidebar();
    return;
  }
  if(e.key==='Escape'){
    if(modalRoot && modalRoot.classList.contains('open')){ e.preventDefault(); closeModal(); }
    return;
  }
  if(e.key==='Tab'){
    const root = document.getElementById('modal-root');
    if(!root || !root.classList.contains('open')) return;
    const box = document.getElementById('modal-box');
    const focusables = Array.from(box.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'))
      .filter(elx => elx.offsetParent !== null);
    if(!focusables.length) return;
    const first = focusables[0], last = focusables[focusables.length-1];
    if(!box.contains(document.activeElement)){
      e.preventDefault();
      first.focus();
      return;
    }
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
});

/* ---------- File download / CSV ---------- */
function downloadFile(filename, content, mime){
  try{
    const blob = new Blob([content], {type: mime || 'application/octet-stream'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    return true;
  }catch(e){
    console.error('File download failed', e);
    return false;
  }
}
function toCSV(rows, columns){
  // UTF-8 BOM improves automatic Unicode detection in Excel and similar
  // spreadsheet applications. CRLF keeps the file broadly compatible.
  const esc = v=>{
    if(v===undefined || v===null) v='';
    v=String(v);
    // Quote every field containing a comma, quote, CR, or LF; embedded
    // quotes are doubled according to the CSV format.
    if(/[",\r\n]/.test(v)) v='"'+v.replace(/"/g,'""')+'"';
    return v;
  };
  const header = columns.map(c=>esc(c.label)).join(',');
  const lines = rows.map(r=>columns.map(c=>esc(typeof c.value==='function'?c.value(r):r[c.value])).join(','));
  return '\uFEFF' + [header, ...lines].join('\r\n');
}

/* ---------- Form field builders ---------- */
function fieldHtml(id, label, innerHtml, errorMsg, hint, required){
  const describedBy = [];
  if(hint) describedBy.push(`${id}-hint`);
  if(errorMsg) describedBy.push(`${id}-error`);
  let controlHtml = innerHtml;
  const controlAttrs = [
    required ? ' aria-required="true"' : '',
    errorMsg ? ' aria-invalid="true"' : '',
    describedBy.length ? ` aria-describedby="${describedBy.join(' ')}"` : ''
  ].join('');
  controlHtml = controlHtml.replace(/<(input|select|textarea)(\s)/i, '<$1' + controlAttrs + '$2');
  return `<div class="field ${errorMsg?'error':''}">
    <label for="${id}">${escapeHtml(label)}${required ? ' <span aria-hidden="true">*</span>' : ''}</label>
    ${controlHtml}
    ${hint?`<div class="hint" id="${id}-hint">${escapeHtml(hint)}</div>`:''}
    ${errorMsg?`<div class="field-error" id="${id}-error" role="alert">${escapeHtml(errorMsg)}</div>`:''}
  </div>`;
}
function textField(o){
  const type = o.type||'text';
  const step = type==='number' ? (o.step||'0.01') : null;
  return fieldHtml(o.id, o.label,
    `<input type="${type}" id="${o.id}" name="${o.id}" value="${escapeHtml(o.value!==undefined?o.value:'')}"
      placeholder="${escapeHtml(o.placeholder||'')}" ${step?`step="${step}"`:''} ${o.min!==undefined?`min="${o.min}"`:''}
      ${o.maxlength?`maxlength="${o.maxlength}"`:''} ${o.required?'required':''} ${o.readonly?'readonly':''}>`, o.error, o.hint, !!o.required);
}
function selectField(o){
  const opts = (o.options||[]).map(opt=>{
    const val = Array.isArray(opt)?opt[0]:opt.value;
    const lab = Array.isArray(opt)?opt[1]:opt.label;
    return `<option value="${escapeHtml(val)}" ${String(val)===String(o.value)?'selected':''}>${escapeHtml(lab)}</option>`;
  }).join('');
  return fieldHtml(o.id, o.label,
    `<select id="${o.id}" name="${o.id}" ${o.required?'required':''}>
      ${o.placeholder?`<option value="">${escapeHtml(o.placeholder)}</option>`:''}${opts}
    </select>`, o.error, o.hint, !!o.required);
}
function textareaField(o){
  return fieldHtml(o.id, o.label,
    `<textarea id="${o.id}" name="${o.id}" placeholder="${escapeHtml(o.placeholder||'')}" ${o.maxlength?`maxlength="${o.maxlength}"`:''} ${o.required?'required':''}>${escapeHtml(o.value||'')}</textarea>`, o.error, o.hint, !!o.required);
}

function mountTransactionsPage(el){
  const st = UI_STATE.transactions;
  const range = activeRange('transactions');
  if(!range){ renderInvalidRangeState(el, 'transactions', ()=>mountTransactionsPage(el)); return; }
  const q = st.q.trim().toLowerCase();
  let rows = allTransactions().filter(r=>{
    if(!inRange(r.date, range.start, range.end)) return false;
    if(st.type && r.kind!==st.type) return false;
    if(st.category && r.category!==st.category) return false;
    if(q && !((r.description||'').toLowerCase().includes(q) || (r.category||'').toLowerCase().includes(q))) return false;
    return true;
  });
  const net = round2(sum(rows, r=>r.amount));
  const catSet = new Set(STORE.state.income.map(i=>i.source).concat(STORE.state.expenses.map(e=>e.category)));
  const catOpts = [['',t('common.allCategories')]].concat(Array.from(catSet).sort().map(c=>[c,c]));

  el.innerHTML = `
    <div class="card" style="margin-bottom:16px;">
      <div class="row between wrap" style="gap:10px;">
        ${rangeFilterBar('transactions')}
        <div class="stat-card" style="text-align:right;"><div class="label">${escapeHtml(t('transactions.netTotal'))}</div><div class="value ${net<0?'neg':''}">${fmtMoney(net)}</div></div>
      </div>
    </div>
    <div class="card">
      <div class="table-toolbar">
        <div class="search"><input type="text" id="tx-search" aria-label="${escapeHtml(t('transactions.searchAria'))}" placeholder="${escapeHtml(t('transactions.searchPlaceholder'))}" value="${escapeHtml(st.q)}"></div>
        <select id="tx-type-filter" aria-label="${escapeHtml(t('transactions.filterTypeAria'))}" style="width:auto;">
          <option value="" ${!st.type?'selected':''}>${escapeHtml(t('common.allTypes'))}</option>
          <option value="income" ${st.type==='income'?'selected':''}>${escapeHtml(t('transactions.typeIncome'))}</option>
          <option value="expense" ${st.type==='expense'?'selected':''}>${escapeHtml(t('transactions.typeExpense'))}</option>
        </select>
        <select id="tx-cat-filter" aria-label="${escapeHtml(t('common.filterByCategory'))}" style="width:auto;">${catOpts.map(([v,l])=>`<option value="${escapeHtml(v)}" ${st.category===v?'selected':''}>${escapeHtml(l)}</option>`).join('')}</select>
        <div class="spacer"></div>
        <button class="btn btn-outline btn-sm" id="tx-export">${escapeHtml(t('common.exportCsv'))}</button>
      </div>
      ${rows.length ? `
      <div class="table-wrap"><table class="data">
        <thead><tr><th scope="col">${escapeHtml(t('transactions.thDate'))}</th><th scope="col">${escapeHtml(t('transactions.thType'))}</th><th scope="col">${escapeHtml(t('transactions.thCategory'))}</th><th scope="col">${escapeHtml(t('transactions.thDescription'))}</th><th scope="col" class="num">${escapeHtml(t('transactions.thAmount'))}</th></tr></thead>
        <tbody>${rows.map(r=>`
          <tr><td>${fmtDate(r.date)}</td>
          <td><span class="badge ${r.kind==='income'?'badge-green':'badge-red'}">${escapeHtml(r.kind==='income'?t('transactions.typeIncome'):t('transactions.typeExpense'))}</span></td>
          <td>${escapeHtml(r.category||'—')}</td><td>${escapeHtml(r.description||'—')}</td>
          <td class="num"><strong class="${r.amount<0?'amount-neg':'amount-pos'}">${fmtMoney(r.amount)}</strong></td></tr>`).join('')}
        </tbody>
      </table></div>`
      : emptyState('&#128203;',t('transactions.emptyTitle'),t('transactions.emptyText'), emptyActionButtons([
        `<button class="btn btn-accent btn-sm" type="button" data-tx-empty="income">${escapeHtml(t('dashboard.emptyActionIncome'))}</button>`,
        `<button class="btn btn-outline btn-sm" type="button" data-tx-empty="expense">${escapeHtml(t('dashboard.emptyActionExpense'))}</button>`
      ]))}
    </div>`;
  wireRangeFilterBar(el, 'transactions', ()=>mountTransactionsPage(el));

    if(!uxButtonLock(btn)) return;

  el.querySelector('#tx-type-filter').addEventListener('change', e=>{ st.type=e.target.value; mountTransactionsPage(el); });
  el.querySelector('#tx-cat-filter').addEventListener('change', e=>{ st.category=e.target.value; mountTransactionsPage(el); });
  const exp = el.querySelector('#tx-export');
  if(exp) exp.addEventListener('click', ()=>{
    const csv = toCSV(rows, [{label:t('transactions.thDate'),value:'date'},{label:t('transactions.thType'),value:r=>r.kind==='income'?t('transactions.typeIncome'):t('transactions.typeExpense')},{label:t('transactions.thCategory'),value:'category'},{label:t('transactions.thDescription'),value:'description'},{label:t('transactions.thAmount'),value:'amount'}]);

  if(st.tab==='monthly') return renderMonthlyBudgetReport(body, st);

function profileHasData(){
  const s = STORE.state.settings;
  return !!(s && String(s.profileName || '').trim());
}
function profileCurrencyOptions(){
  return [['$',t('settings.currencyDollar')],['€',t('settings.currencyEuro')],['£',t('settings.currencyPound')],['₦',t('settings.currencyNaira')],['₹',t('settings.currencyRupee')],['A$',t('settings.currencyAud')],['C$',t('settings.currencyCad')]];
}
function profileWeekdayOptions(){
  return [['0',t('settings.weekdaySunday')],['1',t('settings.weekdayMonday')],['2',t('settings.weekdayTuesday')],['3',t('settings.weekdayWednesday')],['4',t('settings.weekdayThursday')],['5',t('settings.weekdayFriday')],['6',t('settings.weekdaySaturday')]];
}
function openProfileManager(){
  const render = mode=>{
    const s = STORE.state.settings;
    const has = profileHasData();
    if(mode==='view'){
      openModal({
        title:t('profile.title'),
        bodyHtml:`<div class="card" style="margin:0;border:1px solid var(--border);box-shadow:none;">
          <div class="section-title">${escapeHtml(has?t('profile.viewTitle'):t('profile.noProfile'))}</div>
          ${has ? `<div class="form-grid">
            <div><div class="hint">${escapeHtml(t('profile.fieldName'))}</div><div style="font-weight:700;margin-top:4px;">${escapeHtml(s.profileName||t('profile.emptyValue'))}</div></div>
            <div><div class="hint">${escapeHtml(t('profile.fieldCurrencySymbol'))}</div><div style="font-weight:700;margin-top:4px;">${escapeHtml(s.currencySymbol||t('profile.emptyValue'))}</div></div>
            <div><div class="hint">${escapeHtml(t('profile.fieldDateFormat'))}</div><div style="font-weight:700;margin-top:4px;">${escapeHtml(s.dateFormat||t('profile.emptyValue'))}</div></div>
            <div><div class="hint">${escapeHtml(t('profile.fieldNearLimitThreshold'))}</div><div style="font-weight:700;margin-top:4px;">${escapeHtml(String(s.nearLimitThresholdPct??t('profile.emptyValue')))}</div></div>
            <div><div class="hint">${escapeHtml(t('profile.fieldFirstDayOfWeek'))}</div><div style="font-weight:700;margin-top:4px;">${escapeHtml((profileWeekdayOptions().find(x=>x[0]===String(s.firstDayOfWeek||0))||['',t('profile.emptyValue')])[1])}</div></div>
          </div>` : `<p class="hint" style="margin:0;">${escapeHtml(t('profile.noProfile'))}</p>`}
          ${has ? `<p class="hint" style="margin:16px 0 0;">${escapeHtml(t('profile.removeHint'))}</p>` : ''}
        </div>`,
        footerHtml:has ? `<button class="btn btn-outline" id="profile-edit-btn">${escapeHtml(t('profile.edit'))}</button><button class="btn btn-danger" id="profile-remove-btn">${escapeHtml(t('profile.remove'))}</button>` : `<button class="btn btn-accent" id="profile-add-btn">${escapeHtml(t('profile.add'))}</button>`,
        onMount(box){
          if(has){
            box.querySelector('#profile-edit-btn').addEventListener('click',()=>render('edit'));
            box.querySelector('#profile-remove-btn').addEventListener('click',()=>confirmAction(t('profile.deleteConfirm'),()=>{
              const saved = STORE.mutate(stt=>{ stt.settings.profileName=''; stt.settings.currencySymbol='$'; stt.settings.currencyCode='USD'; stt.settings.dateFormat='MM/DD/YYYY'; stt.settings.nearLimitThresholdPct=90; stt.settings.firstDayOfWeek=0; });
              if(saved) toast(t('profile.removed'),'success');
              else toast(t('backup.saveFailedWarning'),'error');
            },{title:t('profile.remove'),confirmLabel:t('profile.remove')}));
          } else {
            box.querySelector('#profile-add-btn').addEventListener('click',()=>render('create'));
          }
        }
      });
      return;
    }
    const isCreate=mode==='create';
    openModal({
      title:t(isCreate?'profile.createTitle':'profile.editTitle'),
      bodyHtml:`<form id="profile-form">
        <div class="form-grid">
          ${textField({id:'profile-name',maxlength:200,label:t('profile.fieldName'),value:isCreate?'':s.profileName||''})}
          ${selectField({id:'profile-currencySymbol',label:t('profile.fieldCurrencySymbol'),value:s.currencySymbol||'$',options:profileCurrencyOptions()})}
        </div>
        <div class="form-grid">
          ${selectField({id:'profile-dateFormat',label:t('profile.fieldDateFormat'),value:s.dateFormat||'MM/DD/YYYY',options:[['MM/DD/YYYY','MM/DD/YYYY'],['DD/MM/YYYY','DD/MM/YYYY'],['YYYY-MM-DD','YYYY-MM-DD']]})}
          ${selectField({id:'profile-firstDayOfWeek',label:t('profile.fieldFirstDayOfWeek'),value:String(s.firstDayOfWeek||0),options:profileWeekdayOptions()})}
        </div>
        ${textField({id:'profile-nearLimitThresholdPct',label:t('profile.fieldNearLimitThreshold'),type:'number',step:'1',value:s.nearLimitThresholdPct??90, hint:t('profile.nearLimitHint')})}
        <div id="profile-form-errors" style="margin-top:12px;"></div>
      </form>`,
      footerHtml:`<button class="btn btn-outline" data-close-modal="1">${escapeHtml(t('common.cancel'))}</button><button class="btn btn-accent" id="profile-save-btn">${escapeHtml(isCreate?t('profile.create'):t('common.saveChanges'))}</button>`,
      onMount(box){
        box.querySelector('#profile-save-btn').addEventListener('click',()=>{
          const data=formData(box.querySelector('#profile-form'));
          const name=String(data['profile-name']||'').trim();
          if(!name){box.querySelector('#profile-form-errors').innerHTML=formErrorsBanner([t('profile.requiredName')]);return;}
          const saved = STORE.mutate(stt=>{
            stt.settings.profileName=name;
            stt.settings.currencySymbol=data['profile-currencySymbol']||'$';
            stt.settings.dateFormat=data['profile-dateFormat']||'MM/DD/YYYY';
            stt.settings.firstDayOfWeek=Math.min(6,Math.max(0,Math.floor(safeNum(data['profile-firstDayOfWeek'],0))));
            stt.settings.nearLimitThresholdPct=Math.min(100,Math.max(1,Math.floor(safeNum(String(data['profile-nearLimitThresholdPct']??'').trim()===''?NaN:data['profile-nearLimitThresholdPct'],90))));
          });
          if(!saved){ box.querySelector('#profile-form-errors').innerHTML=formErrorsBanner([t('backup.saveFailedWarning')]); return; }
          closeModal();
          toast(t(isCreate?'profile.created':'profile.saved'),'success');
        });
      }
    });
  };
  render('view');
}

   BACKUP/RESTORE, WELCOME GATE, AND APP BOOTSTRAP
   ============================================================ */
const PAGE_MOUNTERS = {
  dashboard: mountDashboardPage,
  income: mountIncomePage,
  budget: mountBudgetPage,
  expenses: mountExpensesPage,
  transactions: mountTransactionsPage,
  savings: mountSavingsPage,
  reports: mountReportsPage,
  settings: mountSettingsPage,
  guide: mountGuidePage
};

function renderApp(){
  const appEl = document.getElementById('app');
  const gateEl = document.getElementById('welcome-gate');
  if(!appEl || !gateEl) return;

  if(!STORE.state.meta.onboarded){
    appEl.style.display = 'none';
    gateEl.style.display = 'block';
    if(typeof renderWelcomeGate === 'function') renderWelcomeGate(gateEl);
    return;
  }
  appEl.style.display = '';
  gateEl.style.display = 'none';

  const route = currentRoute();
  const titleEl = document.getElementById('page-title');
  if(titleEl) titleEl.textContent = t(ROUTE_TITLE_KEYS[route] || 'nav.dashboard');
  renderSidebar();
  const content = document.getElementById('content');
  if(!content) return;
  const mounter = PAGE_MOUNTERS[route] || mountDashboardPage;
  mounter(content);
  decorateChartAccessibility(content);
}

let SHELL_CHROME_WIRED = false;
function initShellChrome(){
  if(SHELL_CHROME_WIRED) return;
  SHELL_CHROME_WIRED = true;
  const toggle = document.getElementById('sidebar-toggle');
  if(toggle) toggle.addEventListener('click', ()=>{ const sidebar=document.getElementById('sidebar'); if(sidebar && sidebar.classList.contains('open')) closeSidebar(); else openSidebar(); });
  const backdrop = document.getElementById('sidebar-backdrop');
  if(backdrop) backdrop.addEventListener('click', closeSidebar);
  const profileBtn = document.getElementById('profile-btn');
  if(profileBtn) profileBtn.addEventListener('click', ()=>{ openProfileManager(); });
  document.documentElement.lang = CURRENT_LANG;
  const langSelect = document.getElementById('lang-select');
  if(langSelect){
    langSelect.value = CURRENT_LANG;
    langSelect.addEventListener('change', (e)=>{ setLanguage(e.target.value); });
  }
  window.addEventListener('resize', ()=>{ const sidebar=document.getElementById('sidebar'); syncSidebarAccessibility(!!(sidebar && sidebar.classList.contains('open'))); });
  refreshStaticChromeText();
}
function refreshStaticChromeText(){
  const profileBtn = document.getElementById('profile-btn');
  if(profileBtn) profileBtn.textContent = t('shell.profile');
  const toggle = document.getElementById('sidebar-toggle');
  if(toggle) syncSidebarAccessibility(document.getElementById('sidebar')?.classList.contains('open') || false);
  const foot = document.querySelector('#sidebar .foot');
  if(foot) foot.textContent = 'Personal Budget Planner · ' + t('shell.allDataStoredLocally');
}

/* ---------- Demo data generator ---------- */
function daysAgoISO(n){ const d = new Date(); d.setDate(d.getDate()-n); return localDateISO(d); }
function seededRand(seed){ let s = seed % 2147483647; if(s<=0) s += 2147483646; return function(){ s = s*16807 % 2147483647; return (s-1)/2147483646; }; }
function generateDemoRecords(){
  const s = STORE.state;
  const rand = seededRand(42);
  const mk0 = currentMonthKey();
  const months = lastNMonthKeys(6); // oldest .. newest, includes mk0 as last

  // ---- Income: monthly salary for 6 months + a few freelance/gift entries ----
  months.forEach((mk,i)=>{
    s.income.push({ id: uid('inc'), source:'Primary Job', amount: 3800, date: mk+'-01', frequency:'monthly', type:'Salary', notes:'', createdAt: nowISO(), updatedAt: nowISO() });
  });
  s.income.push({ id: uid('inc'), source:'Freelance Design Work', amount: 450, date: mk0+'-14', frequency:'one-time', type:'Freelance', notes:'Logo project for a local client', createdAt: nowISO(), updatedAt: nowISO() });
  s.income.push({ id: uid('inc'), source:'Freelance Design Work', amount: 320, date: monthAdd(mk0,-1)+'-09', frequency:'one-time', type:'Freelance', notes:'', createdAt: nowISO(), updatedAt: nowISO() });
  s.income.push({ id: uid('inc'), source:'Birthday Gift', amount: 100, date: monthAdd(mk0,-2)+'-20', frequency:'one-time', type:'Gift', notes:'', createdAt: nowISO(), updatedAt: nowISO() });

  // ---- Budget: planned amounts, current + 2 previous months ----
  const PLAN = { Housing:1200, Utilities:160, Groceries:450, Transportation:180, Healthcare:100, Insurance:150, Debt:300, Shopping:150, Entertainment:100, Education:50, Personal:90, Savings:300, Other:50 };
  [mk0, monthAdd(mk0,-1), monthAdd(mk0,-2)].forEach(mk=>{
    Object.keys(PLAN).forEach(cat=>{
      s.budgets.push({ id: uid('bud'), monthKey: mk, category: cat, planned: PLAN[cat], notes:'', createdAt: nowISO(), updatedAt: nowISO() });
    });
  });

  // ---- Expenses across the last 6 months ----
  const pmByName = name => (s.paymentMethods.find(p=>p.name===name) || s.paymentMethods[0]).id;
  function addExp(mk, day, category, amount, description, method){
    s.expenses.push({ id: uid('exp'), date: mk+'-'+String(day).padStart(2,'0'), category, amount: round2(amount), description, paymentMethodId: pmByName(method||'Debit Card'), notes:'', createdAt: nowISO(), updatedAt: nowISO() });
  }
  months.forEach((mk,i)=>{
    const isCurrent = mk===mk0;
    addExp(mk, 1, 'Housing', 1200, 'Monthly rent', 'Bank Transfer');
    addExp(mk, 5, 'Utilities', 65+Math.round(rand()*20), 'Electric bill', 'Bank Transfer');
    addExp(mk, 7, 'Utilities', 55, 'Internet & cable', 'Bank Transfer');
    addExp(mk, 18, 'Utilities', 25+Math.round(rand()*10), 'Water bill', 'Bank Transfer');
    addExp(mk, 3, 'Groceries', 110+Math.round(rand()*20), 'Weekly grocery run', 'Debit Card');
    addExp(mk, 10, 'Groceries', 95+Math.round(rand()*25), 'Weekly grocery run', 'Debit Card');
    addExp(mk, 17, 'Groceries', 105+Math.round(rand()*20), 'Weekly grocery run', 'Debit Card');
    addExp(mk, 24, 'Groceries', 90+Math.round(rand()*20), 'Weekly grocery run', 'Debit Card');
    addExp(mk, 6, 'Transportation', 60+Math.round(rand()*15), 'Gas', 'Credit Card');
    addExp(mk, 20, 'Transportation', 75+Math.round(rand()*20), 'Gas & parking', 'Credit Card');
    addExp(mk, 15, 'Insurance', 150, 'Auto + renters insurance', 'Bank Transfer');
    addExp(mk, 2, 'Debt', 300, 'Student loan payment', 'Bank Transfer');
    addExp(mk, 12, 'Entertainment', isCurrent ? 92 : (40+Math.round(rand()*35)), isCurrent?'Concert tickets + streaming':'Streaming & a movie night', 'Credit Card');
    addExp(mk, 22, 'Personal', 35+Math.round(rand()*25), 'Haircut & personal care', 'Debit Card');
    addExp(mk, 28, 'Savings', 300, 'Transfer to savings', 'Bank Transfer');
    if(i%2===0) addExp(mk, 9, 'Healthcare', 20+Math.round(rand()*40), 'Pharmacy', 'Debit Card');
    if(i===months.length-1){
      addExp(mk, 8, 'Shopping', 128, 'New shoes', 'Credit Card');
      addExp(mk, 19, 'Shopping', 96, 'Birthday present', 'Credit Card');
    } else {
      addExp(mk, 14, 'Shopping', 30+Math.round(rand()*40), 'Miscellaneous shopping', 'Credit Card');
    }
    if(i===months.length-2) addExp(mk, 11, 'Education', 50, 'Online course', 'Credit Card');
    if(i===months.length-1) addExp(mk, 26, 'Other', 22, 'Miscellaneous', 'Cash');
  });

  // ---- Savings goals ----
  s.savingsGoals.push({ id: uid('goal'), name:'Emergency Fund', targetAmount:5000, currentAmount:2150, targetDate: monthAdd(mk0,8)+'-01', notes:'Three months of essential expenses.', contributions:[{id:uid('contrib'),date:monthAdd(mk0,-2)+'-05',amount:600},{id:uid('contrib'),date:monthAdd(mk0,-1)+'-05',amount:600},{id:uid('contrib'),date:mk0+'-05',amount:600}], createdAt: nowISO(), updatedAt: nowISO() });
  s.savingsGoals.push({ id: uid('goal'), name:'Vacation', targetAmount:1500, currentAmount:640, targetDate: monthAdd(mk0,5)+'-15', notes:'A week at the coast next summer.', contributions:[{id:uid('contrib'),date:monthAdd(mk0,-1)+'-10',amount:320},{id:uid('contrib'),date:mk0+'-10',amount:320}], createdAt: nowISO(), updatedAt: nowISO() });
  s.savingsGoals.push({ id: uid('goal'), name:'New Laptop', targetAmount:1200, currentAmount:1200, targetDate: monthAdd(mk0,-1)+'-01', notes:'Fully funded — ready to buy!', contributions:[{id:uid('contrib'),date:monthAdd(mk0,-2)+'-01',amount:1200}], createdAt: nowISO(), updatedAt: nowISO() });
}
function loadDemoData(){
  const previousState = STORE.state;
  const realSave = STORE.save.bind(STORE);
  const realRender = STORE.render.bind(STORE);
  STORE.state = defaultState();
  STORE.save = function(){};
  STORE.render = function(){};
  let generationError = null;
  try{
    generateDemoRecords();
  } catch(e){
    generationError = e;
    console.error('Demo data generation failed', e);
  } finally {
    STORE.save = realSave;
    STORE.render = realRender;
  }
  if(generationError){
    STORE.state = previousState;
    toast(t('welcome.toastDemoLoadFailed'), 'error');
    return false;
  }
  STORE.state.meta.demoLoaded = true;
  STORE.state.meta.onboarded = true;
  STORE.state.settings.disclaimerAcknowledged = true;
  if(!STORE.save()){
    STORE.state = previousState;
    STORE.render();
    return false;
  }
  STORE.render();
  return true;
}

/* ---------- Start Fresh: clears financial records but keeps Settings/Profile/Categories/Payment Methods/Language intact. ---------- */
function startFresh(){
  const before = JSON.stringify(STORE.state);
  try{
    if(!exportBackup(false)) return false;
    STORE.state.income = [];
    STORE.state.budgets = [];
    STORE.state.expenses = [];
    STORE.state.savingsGoals = [];
    STORE.state.meta.demoLoaded = false;
    STORE.state.meta.onboarded = true;
    if(!STORE.save()){
      STORE.state = JSON.parse(before);
      STORE.render();
      return false;
    }
    STORE.render();
    return true;
  }catch(e){
    console.error('Start Fresh failed', e);
    try{ STORE.state = JSON.parse(before); }catch(_){}
    setSaveIndicator(false);
    toast(t('backup.saveFailedWarning'), 'error');
    STORE.render();
    return false;
  }
}

/* ---------- Reset All Data: full first-run reset, including settings, profile, categories, and payment methods. Language preference is untouched (stored separately). ---------- */
function resetAllData(){
  const before = JSON.stringify(STORE.state);
  const beforeLang = CURRENT_LANG;
  try{
    if(!exportBackup(false)) return false;
    STORE.state = defaultState();
    if(!STORE.save()){
      STORE.state = JSON.parse(before);
      CURRENT_LANG = beforeLang;
      STORE.render();
      return false;
    }
    try{ localStorage.removeItem(LANG_STORAGE_KEY); }catch(e){ console.warn('Could not clear language preference', e); }
    CURRENT_LANG = 'en';
    document.documentElement.lang = CURRENT_LANG;
    const langSel = document.getElementById('lang-select');
    if(langSel) langSel.value = CURRENT_LANG;
    STORE.render();
    refreshStaticChromeText();
    setSaveIndicator(SAVE_OK);
    return true;
  }catch(e){
    console.error('Reset All Data failed', e);
    try{ STORE.state = JSON.parse(before); }catch(_){}
    CURRENT_LANG = beforeLang;
    setSaveIndicator(false);
    toast(t('backup.saveFailedWarning'), 'error');
    STORE.render();
    return false;
  }
}

/* ---------- Backup export / import ---------- */
function exportBackup(showToast=true){
  try{
    const payload = JSON.stringify(STORE.state, null, 2);
    const ok = downloadFile(`personal-budget-planner-backup-${todayISO()}.json`, payload, 'application/json');
    if(!ok){
      toast(t('backup.saveFailedWarning'), 'error');
      return false;
    }
    if(showToast) toast(t('backup.toastExported'), 'success');
    return true;
  }catch(e){
    console.error('Backup export failed', e);
    toast(t('backup.saveFailedWarning'), 'error');
    return false;
  }
}
function importBackupFile(file){
  if(!file){ return; }
  const reader = new FileReader();
  reader.onload = ()=>{
    let parsed = null;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ toast(t('backup.notValidJson'), 'error'); return; }
    const errors = validateStateShape(parsed);
    if(errors.length){
      const moreIssues = errors.length>1 ? t('backup.andMoreIssues',{n:errors.length-1}) : '';
      toast(t('backup.importFailed',{error:errors[0]}) + moreIssues, 'error');
      return;
    }
    const budgetIssues = findBudgetIntegrityIssues(parsed.budgets);
    if(budgetIssues.length){
      toast(t('backup.importFailed',{error:t('budget.duplicateInBackup')}) , 'error');
      return;
    }
    confirmAction(t('backup.confirmImport'), ()=>{
      const before = JSON.stringify(STORE.state);
      if(!exportBackup(false)) return;
      try{
        STORE.state = migrateState(parsed);
        STORE.state.meta.onboarded = true;
        if(!STORE.save()){
          STORE.state = JSON.parse(before);
          STORE.render();
          return;
        }
        STORE.render();
        toast(t('backup.toastImported'), 'success');
        navigateTo('dashboard');
      }catch(e){
        console.error('Import failed during replacement', e);
        try{ STORE.state = JSON.parse(before); }catch(_){}
        setSaveIndicator(false);
        toast(t('backup.saveFailedWarning'), 'error');
        STORE.render();
      }
    }, {title:t('backup.importBackupTitle'), confirmLabel:t('backup.importAndReplace')});
  };
  reader.onerror = ()=>{ toast(t('backup.couldNotReadFile'), 'error'); };
  reader.readAsText(file);
}

  elx.innerHTML = `
    <div class="welcome-card">
      <h2>${escapeHtml(t('welcome.title'))}</h2>
      <div class="sub">${escapeHtml(t('welcome.subtitle'))}</div>
      <div class="welcome-choice">
        <button class="welcome-option" id="wg-demo" type="button">
          <div class="opt-icon">&#10024;</div>
          <h4>${escapeHtml(t('welcome.demoTitle'))}</h4>
          <p>${escapeHtml(t('welcome.demoText'))}</p>
        </button>
        <button class="welcome-option" id="wg-fresh" type="button">
          <div class="opt-icon">&#128204;</div>
          <h4>${escapeHtml(t('welcome.freshTitle'))}</h4>
          <p>${escapeHtml(t('welcome.freshText'))}</p>
        </button>
      </div>
      <div class="welcome-disclaimer">${escapeHtml(t('welcome.disclaimer'))}</div>

}

function initApp(){
  STORE.load();
  initShellChrome();

}
if(document.readyState === 'loading'){
